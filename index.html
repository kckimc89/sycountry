<script>
const COUNTRIES={"KR": {"name": "대한민국", "capital": "서울", "area": "약 100,459㎢", "population": "약 5,168만 명", "language": "한국어", "script": "한글", "currency": "대한민국 원(KRW)", "location": "동아시아의 한반도 남쪽에 자리하며 동쪽은 동해, 서쪽은 서해, 남쪽은 남해와 이어집니다.", "climate": "사계절의 변화가 비교적 뚜렷합니다. 여름은 덥고 비가 많은 편이며 겨울은 춥고 건조한 날이 많습니다.", "languageText": "한국어가 주된 언어이며, 한글은 한국어를 적는 데 사용하는 문자입니다. 한글은 자음과 모음을 조합해 글자를 만드는 체계적인 문자입니다.", "capitalText": "서울은 대한민국의 수도이며 정치·경제·문화·교육의 중심지 가운데 하나입니다. 한강이 도시를 가로지르고 북한산을 비롯한 산지가 주변에 있습니다.", "natureText": "산지가 많은 나라로 태백산맥과 소백산맥 등이 이어집니다. 한강·낙동강·금강·영산강 같은 큰 강과 동해·서해·남해의 다양한 해안 환경이 있습니다.", "flag": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag%20of%20South%20Korea.svg", "map": "https://commons.wikimedia.org/wiki/Special:FilePath/South%20Korea%20location%20map.svg", "worldmap": "https://commons.wikimedia.org/wiki/Special:FilePath/South%20Korea%20on%20the%20globe%20%28Asia_centered%29.svg", "mapNote": "붉은 점은 수도 서울의 위치를 나타냅니다.", "foodIntro": "한국 음식은 밥과 국, 여러 반찬을 함께 먹는 식문화가 발달했으며 발효 음식도 많습니다.", "animalsIntro": "산림·하천·습지·갯벌·섬과 바다 등 다양한 생태환경이 있습니다.", "placesIntro": "궁궐과 사찰 같은 역사 유산부터 산·해안·전통 마을까지 다양한 명소가 있습니다.", "cultureIntro": "전통 의복·명절·놀이·공연예술과 현대의 대중문화가 함께 발전하고 있습니다.", "history": [["기원전 2333년경", "고조선이 세워졌다고 전해집니다."], ["668년", "신라가 한반도 대부분을 통합하면서 통일신라 시대가 시작되었습니다."], ["918년", "왕건이 고려를 세웠습니다."], ["1392년", "이성계가 조선을 세웠습니다."], ["1446년", "훈민정음이 반포되었습니다."], ["1919년", "3·1운동이 일어났고 대한민국 임시정부가 수립되었습니다."], ["1948년", "대한민국 정부가 수립되었습니다."], ["1950년", "한국전쟁이 시작되었습니다."], ["1953년", "정전협정이 체결되었습니다."], ["1988년", "서울에서 하계 올림픽이 열렸습니다."], ["2002년", "한일 월드컵이 대한민국과 일본에서 공동 개최되었습니다."]], "food": [["김치", "채소를 소금에 절이고 양념해 발효시킨 한국의 대표 음식입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Kimchi.jpg?width=700"], ["비빔밥", "밥에 여러 나물과 채소, 고기 등을 올리고 양념과 함께 비벼 먹는 음식입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Bibimbap.jpg?width=700"], ["불고기", "얇게 썬 고기를 양념해 굽거나 익혀 먹는 대표적인 한국 음식입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Bulgogi.jpg?width=700"], ["냉면", "차가운 육수나 양념과 함께 먹는 한국의 대표적인 면 요리입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Naengmyeon.jpg?width=700"]], "animals": [["호랑이", "한반도의 전통문화에 자주 등장하는 대형 고양잇과 동물입니다. 현재 대한민국 야생에서는 보기 어렵습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Siberian%20Tiger.jpg?width=700"], ["반달가슴곰", "가슴의 흰 반달 모양 무늬가 특징이며 우리나라에서는 복원과 보호가 이루어지고 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Ursus%20thibetanus%20ussuricus.jpg?width=700"], ["두루미", "긴 다리와 목을 가진 큰 새로 우리나라 습지에 찾아오는 대표적인 겨울 철새입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Red-crowned%20crane.jpg?width=700"], ["무궁화", "여름에 꽃을 피우는 낙엽성 관목으로 대한민국을 상징하는 꽃으로 널리 알려져 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Hibiscus%20syriacus.jpg?width=700"]], "places": [["경복궁", "1395년에 처음 지어진 조선의 법궁으로 근정전과 경회루 등 여러 건물이 남아 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Gyeongbokgung%20Palace.png?width=700"], ["불국사", "경주에 있는 신라 시대의 대표적인 불교 사찰로 석가탑과 다보탑 등이 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Bulguksa.jpg?width=700"], ["한라산", "제주도 중앙의 화산으로 대한민국에서 가장 높은 산입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Hallasan.jpg?width=700"], ["수원 화성", "조선 정조 때 축조된 성곽으로 성문과 방어 시설이 잘 남아 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Hwaseong%20Fortress.jpg?width=700"]], "culture": [["한복", "저고리와 치마 또는 바지 등을 기본으로 하는 한국의 전통 의복입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Hanbok%20%ED%95%9C%EB%B3%B5%20%284261102177%29.jpg?width=700"], ["설날", "음력 1월 1일을 중심으로 새해를 맞으며 세배와 떡국 등을 즐기는 대표 명절입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Seollal.jpg?width=700"], ["판소리", "소리꾼이 고수의 북 장단에 맞춰 노래와 말, 몸짓으로 긴 이야기를 표현하는 전통예술입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Pansori.jpg?width=700"], ["K-pop", "한국에서 발전한 대중음악으로 노래·춤·공연·영상 등이 함께 어우러지는 현대 문화입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/K-pop%20concert.jpg?width=700"]]}, "JP": {"name": "일본", "capital": "도쿄", "area": "약 377,975㎢", "population": "약 1억 2,297만 명", "language": "일본어", "script": "한자·히라가나·가타카나", "currency": "일본 엔(JPY)", "location": "동아시아의 섬나라로 태평양에 길게 이어진 일본 열도를 중심으로 이루어져 있습니다.", "climate": "북쪽의 홋카이도부터 남쪽의 오키나와까지 길게 뻗어 있어 지역에 따라 기후 차이가 큽니다. 장마와 태풍의 영향도 받습니다.", "languageText": "일본어가 주된 언어입니다. 글을 쓸 때 한자와 히라가나, 가타카나를 함께 사용하는 것이 특징입니다.", "capitalText": "도쿄는 일본의 수도이자 정치·경제·문화의 중심지입니다. 넓은 도시권이 형성되어 있으며 현대적인 도시 모습과 오래된 문화가 함께 나타납니다.", "natureText": "일본은 산지가 많고 화산과 온천이 널리 분포합니다. 여러 섬으로 이루어져 해안과 바다의 자연환경도 다양합니다.", "flag": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag%20of%20Japan.svg", "map": "https://commons.wikimedia.org/wiki/Special:FilePath/Japan%20location%20map.svg", "worldmap": "https://commons.wikimedia.org/wiki/Special:FilePath/Japan%20%28orthographic%20projection%29.svg", "mapNote": "일본 열도와 주변 바다의 위치를 살펴볼 수 있습니다.", "foodIntro": "쌀과 생선, 채소를 다양하게 활용하며 계절의 재료를 중요하게 여기는 음식문화가 발달했습니다.", "animalsIntro": "홋카이도의 추운 지역부터 남쪽 섬까지 기후가 달라 다양한 동식물이 살아갑니다.", "placesIntro": "고대 사찰과 성, 전통 마을부터 대도시와 화산·온천 같은 자연 명소까지 다양합니다.", "cultureIntro": "전통 의상·다도·축제와 함께 애니메이션·만화·현대 대중문화도 세계적으로 알려져 있습니다.", "history": [["710년", "나라에 수도를 두고 율령 국가의 체제가 발전했습니다."], ["794년", "헤이안쿄로 수도를 옮겼습니다."], ["1192년경", "무사 계층이 정치의 중심으로 등장하는 가마쿠라 막부가 발전했습니다."], ["1603년", "도쿠가와 이에야스가 에도 막부를 열었습니다."], ["1868년", "메이지 유신을 계기로 근대 국가로의 변화가 빠르게 진행되었습니다."], ["1945년", "제2차 세계대전이 끝났습니다."], ["1964년", "도쿄에서 하계 올림픽이 열렸습니다."], ["2019년", "레이와 시대가 시작되었습니다."]], "food": [["스시", "식초로 간을 한 밥에 생선이나 해산물 등을 올려 먹는 일본의 대표 음식입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Sushi_platter.jpg?width=700"], ["라멘", "면을 국물에 넣고 고기·채소·달걀 등을 곁들여 먹는 면 요리입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Ramen.jpg?width=700"], ["오니기리", "밥을 손으로 뭉쳐 삼각형이나 둥근 모양으로 만들고 속재료를 넣기도 하는 음식입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Onigiri_001.jpg?width=700"], ["텐푸라", "생선이나 채소 등에 얇은 튀김옷을 입혀 바삭하게 튀긴 음식입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Tempura.jpg?width=700"]], "animals": [["일본원숭이", "일본의 산림 지역 등에 사는 원숭이로 추운 지역에서는 눈 속에서도 활동합니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Japanese_macaque.jpg?width=700"], ["시카사슴", "일본 여러 지역에 분포하는 사슴으로 나라 공원 등에서도 잘 알려져 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Sika_deer.jpg?width=700"], ["일본산양", "일본의 산악 지역에 사는 소과 동물로 바위가 많은 곳에서도 생활합니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Japanese_serow.jpg?width=700"], ["벚나무", "봄철에 꽃을 피우며 일본의 계절과 문화에서 상징적으로 자주 등장하는 나무입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Prunus%20serrulata.jpg?width=700"]], "places": [["도쿄", "일본의 수도로 고층 건물과 철도망, 공원, 전통 지역이 함께 발달한 대도시입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Tokyo%20Skyline.jpg?width=700"], ["후지산", "일본에서 가장 높은 산으로 아름다운 원뿔 모양의 화산으로 널리 알려져 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Mount%20Fuji%20from%20Lake%20Kawaguchi.jpg?width=700"], ["교토", "오래된 사찰과 신사, 전통 거리 등이 많이 남아 있는 역사도시입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Kiyomizu-dera_in_Kyoto.jpg?width=700"], ["히로시마 평화기념공원", "제2차 세계대전의 원폭 피해를 기억하고 평화를 생각하는 공간입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Hiroshima%20Peace%20Memorial%20Park.jpg?width=700"]], "culture": [["기모노", "일본의 전통 의상으로 긴 소매와 허리띠인 오비 등이 특징입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Kimono%20Japan.jpg?width=700"], ["다도", "차를 준비하고 대접하는 과정에 예절과 아름다움을 담은 전통 문화입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Japanese_tea_ceremony.jpg?width=700"], ["마쓰리", "지역의 신사나 공동체를 중심으로 열리는 일본의 전통 축제입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Japanese_festival.jpg?width=700"], ["애니메이션", "그림이나 디지털 기술 등을 이용해 움직이는 영상을 만드는 일본의 대표적인 대중문화 분야입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Anime_expo.jpg?width=700"]]}, "CN": {"name": "중국", "capital": "베이징", "area": "약 960만㎢", "population": "약 14억 1천만 명", "language": "중국어(보통화)", "script": "한자(간체자 중심)", "currency": "위안(CNY)", "location": "동아시아에 위치하며 매우 넓은 영토를 가지고 있습니다. 동쪽은 태평양과 여러 바다에 접합니다.", "climate": "국토가 넓어 북쪽의 추운 지역부터 남쪽의 따뜻하고 습한 지역까지 기후가 매우 다양합니다.", "languageText": "중국어가 널리 사용되며 중국 본토의 표준어는 보통화입니다. 한자를 사용하는 문자문화가 오랜 기간 이어져 왔습니다.", "capitalText": "베이징은 중국의 수도입니다. 자금성·천안문 등 역사적 유산과 현대적인 도시 시설이 함께 있는 대도시입니다.", "natureText": "히말라야산맥과 티베트고원, 고비사막, 넓은 평야와 큰 강 등 매우 다양한 지형이 있습니다.", "flag": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag%20of%20the%20People%27s%20Republic%20of%20China.svg", "map": "https://commons.wikimedia.org/wiki/Special:FilePath/China%20location%20map.svg", "worldmap": "https://commons.wikimedia.org/wiki/Special:FilePath/China%20%28orthographic%20projection%29.svg", "mapNote": "중국의 넓은 국토와 주변 국가·바다의 위치를 살펴볼 수 있습니다.", "foodIntro": "지역이 넓어 기후와 식재료에 따라 음식이 크게 달라지며 여러 지역 음식 문화가 발달했습니다.", "animalsIntro": "고산지대·초원·사막·숲·습지 등 다양한 환경에 여러 동물이 살아갑니다.", "placesIntro": "고대 도시와 궁전, 만리장성 같은 유산부터 산과 강의 자연경관까지 다양한 명소가 있습니다.", "cultureIntro": "한자문화와 전통 축제, 차 문화, 전통 공연예술 등 오랜 문화가 이어지고 있습니다.", "history": [["기원전 221년", "진이 중국을 처음으로 크게 통일하고 황제 중심의 국가를 세웠습니다."], ["기원전 206년", "한 왕조가 시작되어 넓은 영역과 교류가 발전했습니다."], ["618년", "당 왕조가 시작되어 동아시아의 국제적 교류가 활발해졌습니다."], ["1271년", "원 왕조가 성립했습니다."], ["1368년", "명 왕조가 시작되었습니다."], ["1644년", "청 왕조가 중국을 통치하기 시작했습니다."], ["1912년", "중화민국이 수립되었습니다."], ["1949년", "중화인민공화국이 수립되었습니다."]], "food": [["베이징 카오야", "오리의 껍질을 바삭하게 구워 얇은 전병과 소스, 채소와 함께 먹는 베이징의 대표 음식입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Peking_duck.jpg?width=700"], ["딤섬", "작은 찜통이나 접시에 다양한 만두와 간식류를 담아 먹는 광둥 지역의 음식문화입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Dim_sum.jpg?width=700"], ["마파두부", "두부와 다진 고기, 매운 양념 등을 함께 조리하는 쓰촨 지역의 대표 요리입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Mapo_doufu.jpg?width=700"], ["짜장면", "중국의 면 요리에서 영향을 받아 한국에서 독자적으로 발전한 음식으로, 중국 음식과 한국 음식의 교류를 살펴볼 수 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Jajangmyeon.jpg?width=700"]], "animals": [["판다", "중국 중부의 산림에 사는 곰과 동물로 대나무를 주로 먹습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Giant_Panda_in_China.jpg?width=700"], ["티베트영양", "티베트고원 같은 높은 초원에서 생활하는 영양으로 추운 환경에 적응했습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Tibetan_antelope.jpg?width=700"], ["양쯔강돌고래", "한때 양쯔강에 살던 민물돌고래로 멸종위기와 보전 문제를 생각하게 하는 동물입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Lipotes_vexillifer.jpg?width=700"], ["대나무", "판다의 주요 먹이이면서 중국의 여러 지역에서 자라는 대표적인 식물입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Bamboo_forest.jpg?width=700"]], "places": [["만리장성", "북방 지역의 방어를 위해 여러 시대에 걸쳐 축조·정비된 거대한 성벽과 요새의 집합입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Great_Wall_of_China.jpg?width=700"], ["자금성", "베이징에 있는 거대한 궁전 단지로 명·청 시대 황실의 중심 공간이었습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Forbidden_City_Beijing.jpg?width=700"], ["장자제", "기둥 모양의 바위 봉우리와 계곡이 이어지는 독특한 자연경관으로 알려진 지역입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Zhangjiajie.jpg?width=700"], ["병마용", "시안 부근에서 발견된 진시황릉 관련 유적으로 수많은 테라코타 병사와 말 조각상이 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Terracotta_Army.jpg?width=700"]], "culture": [["춘절", "음력 새해를 맞는 중국의 대표적인 명절로 가족이 모이고 여러 전통 행사를 합니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Chinese_New_Year.jpg?width=700"], ["용춤", "여러 사람이 긴 용 모형을 움직이며 춤을 추는 전통 공연입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Dragon_dance.jpg?width=700"], ["차 문화", "차를 우려 마시고 대접하는 문화가 오랜 역사 속에서 발전해 왔습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Chinese_tea.jpg?width=700"], ["서예", "붓과 먹으로 한자를 쓰면서 글씨의 모양과 선의 아름다움을 표현하는 전통 예술입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Chinese_calligraphy.jpg?width=700"]]}, "US": {"name": "미국", "capital": "워싱턴 D.C.", "area": "약 983만㎢", "population": "약 3억 4,178만 명", "language": "영어가 널리 사용됨", "script": "로마자", "currency": "미국 달러(USD)", "location": "북아메리카에 있으며 대서양과 태평양 사이에 넓게 자리합니다. 알래스카와 하와이도 미국의 주입니다.", "climate": "국토가 매우 넓어 북극권에 가까운 알래스카부터 열대 기후의 하와이까지 지역별 기후가 크게 다릅니다.", "languageText": "연방 차원의 공용어가 정해져 있지는 않지만 영어가 가장 널리 사용됩니다. 다양한 이민 배경 때문에 여러 언어가 함께 사용됩니다.", "capitalText": "워싱턴 D.C.는 미국의 수도이며 연방 정부의 주요 기관이 모여 있습니다. 백악관과 국회의사당, 여러 국가 기념시설이 있습니다.", "natureText": "로키산맥·애팔래치아산맥, 대평원, 사막, 큰 호수, 긴 해안 등 매우 다양한 자연환경을 볼 수 있습니다.", "flag": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag%20of%20the%20United%20States.svg", "map": "https://commons.wikimedia.org/wiki/Special:FilePath/United%20States%20location%20map.svg", "worldmap": "https://commons.wikimedia.org/wiki/Special:FilePath/USA%20%28orthographic%20projection%29.svg", "mapNote": "미국 본토와 알래스카·하와이의 위치를 함께 살펴볼 수 있습니다.", "foodIntro": "이민과 지역의 영향을 받아 매우 다양한 음식이 발달했으며 지역마다 대표 음식이 다릅니다.", "animalsIntro": "넓은 영토에 사막·초원·산림·습지·해안 등 다양한 생태환경이 있습니다.", "placesIntro": "대도시와 기념시설, 국립공원, 협곡과 폭포 등 자연·문화 명소가 함께 발달했습니다.", "cultureIntro": "다양한 이민 문화가 섞여 음악·영화·스포츠·문학 등 여러 현대 문화가 발달했습니다.", "history": [["1776년", "독립선언을 통해 영국으로부터의 독립을 선언했습니다."], ["1787년", "미국 헌법이 제정되었습니다."], ["1803년", "루이지애나 매입으로 영토가 크게 넓어졌습니다."], ["1861~1865년", "남북전쟁이 일어났습니다."], ["1929년", "대공황이 시작되었습니다."], ["1945년", "제2차 세계대전이 끝났습니다."], ["1969년", "아폴로 11호가 달에 착륙했습니다."], ["2001년", "9·11 테러가 발생했습니다."]], "food": [["햄버거", "빵 사이에 고기 패티와 채소 등을 넣어 먹는 미국의 대표적인 대중 음식입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Hamburger.jpg?width=700"], ["바비큐", "고기 등을 불이나 훈연으로 익히고 소스와 함께 먹는 음식문화로 지역별 방식이 다양합니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Barbecue.jpg?width=700"], ["클램 차우더", "조개와 감자 등을 넣어 끓이는 걸쭉한 수프로 미국 동북부 지역 음식으로 잘 알려져 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Clam_chowder.jpg?width=700"], ["애플파이", "사과를 넣어 구운 파이로 미국의 대중문화에서 친숙한 음식으로 자주 소개됩니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Apple_pie.jpg?width=700"]], "animals": [["흰머리수리", "북아메리카에 사는 큰 맹금류로 미국의 국장과 상징에 사용됩니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Bald_Eagle.jpg?width=700"], ["아메리카들소", "북아메리카 초원에 사는 대형 초식동물로 미국의 자연을 대표하는 동물 가운데 하나입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/American_bison.jpg?width=700"], ["회색곰", "북아메리카의 산림과 산악 지역에 사는 큰 곰으로 지역에 따라 보호되고 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Grizzly_bear.jpg?width=700"], ["세쿼이아", "미국 서부의 일부 지역에서 자라는 매우 큰 나무로 오래된 개체가 유명합니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Sequoia.jpg?width=700"]], "places": [["자유의 여신상", "뉴욕 항구에 있는 거대한 동상으로 자유와 미국을 상징하는 대표적인 명소입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Statue_of_Liberty.jpg?width=700"], ["그랜드캐니언", "콜로라도강이 오랜 시간 동안 암석을 깎아 만든 거대한 협곡입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Grand_Canyon.jpg?width=700"], ["옐로스톤 국립공원", "간헐천과 온천, 야생동물이 있는 세계적으로 유명한 국립공원입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Old_Faithful_Yellowstone.jpg?width=700"], ["워싱턴 D.C.", "백악관·국회의사당·국립박물관 등 미국의 중요한 정부·문화 시설이 모여 있는 수도입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Washington%20D.C.%20skyline.jpg?width=700"]], "culture": [["재즈", "미국에서 발전한 음악 장르로 즉흥연주와 다양한 리듬이 중요한 특징입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Jazz_music.jpg?width=700"], ["할리우드 영화", "미국 영화 산업의 상징적인 이름으로 세계 영화문화에 큰 영향을 준 제작 환경과 작품들이 발전했습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Hollywood_sign.jpg?width=700"], ["야구", "미국에서 오랫동안 인기 있는 스포츠 가운데 하나로 프로야구 문화가 크게 발전했습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Baseball.jpg?width=700"], ["추수감사절", "가족과 함께 식사를 나누며 감사의 의미를 생각하는 미국의 대표적인 공휴일입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Thanksgiving_dinner.jpg?width=700"]]}, "FR": {"name": "프랑스", "capital": "파리", "area": "약 551,695㎢(유럽 본토 기준)", "population": "약 6,872만 명", "language": "프랑스어", "script": "로마자", "currency": "유로(EUR)", "location": "서유럽에 위치하며 대서양과 지중해에 접합니다. 유럽 본토 외에도 여러 해외 영토가 있습니다.", "climate": "서쪽은 대서양의 영향을 받아 비교적 온화하고, 남쪽은 지중해성 기후가 나타나며 산악 지역은 기온이 낮습니다.", "languageText": "프랑스어가 국가의 주요 언어입니다. 로마자를 사용하며 문학과 예술 분야에서 프랑스어가 오랫동안 중요한 역할을 해 왔습니다.", "capitalText": "파리는 프랑스의 수도이자 유럽의 대표적인 문화·예술 도시입니다. 센강을 중심으로 박물관과 역사적인 건축물이 많이 모여 있습니다.", "natureText": "알프스와 피레네산맥, 넓은 평야, 대서양 해안과 지중해 연안 등 다양한 자연환경을 가지고 있습니다.", "flag": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag%20of%20France.svg", "map": "https://commons.wikimedia.org/wiki/Special:FilePath/France%20location%20map.svg", "worldmap": "https://commons.wikimedia.org/wiki/Special:FilePath/France%20%28orthographic%20projection%29.svg", "mapNote": "유럽의 프랑스와 해외 영토를 포함한 프랑스의 위치를 살펴볼 수 있습니다.", "foodIntro": "빵·치즈·육류·해산물·채소 등을 활용한 다양한 지역 음식이 발달했으며 식사 문화도 중요한 문화유산으로 여겨집니다.", "animalsIntro": "알프스 산악지역부터 대서양·지중해 해안까지 다양한 서식지가 있습니다.", "placesIntro": "궁전과 성당, 박물관, 도시 경관과 알프스·지중해의 자연경관이 유명합니다.", "cultureIntro": "미술·문학·건축·음악·패션·요리 등 여러 분야에서 오랜 문화 전통을 가지고 있습니다.", "history": [["기원전 52년", "갈리아 지역이 로마의 지배를 받게 되었습니다."], ["843년", "베르됭 조약 이후 서프랑크 왕국이 발전했습니다."], ["987년", "위그 카페가 왕위에 오르며 카페 왕조가 시작되었습니다."], ["1789년", "프랑스 혁명이 시작되었습니다."], ["1804년", "나폴레옹이 황제로 즉위했습니다."], ["1870년", "프랑스 제3공화국이 시작되었습니다."], ["1944년", "제2차 세계대전 중 파리가 해방되었습니다."], ["1957년", "유럽 통합의 출발점 가운데 하나인 로마 조약에 참여했습니다."]], "food": [["바게트", "길고 바삭한 껍질이 특징인 프랑스의 대표적인 빵입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Baguette.jpg?width=700"], ["크루아상", "버터를 넣은 반죽을 여러 겹으로 접어 구운 초승달 모양의 빵입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Croissant-France.jpg?width=700"], ["라타투이", "가지·토마토·호박 등의 채소를 익혀 만드는 프랑스 남부의 대표적인 채소 요리입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Ratatouille.jpg?width=700"], ["치즈", "우유를 발효·숙성해 만드는 식품으로 프랑스에는 매우 다양한 종류가 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/French_cheese.jpg?width=700"]], "animals": [["알프스아이벡스", "알프스 산악지대의 바위가 많은 곳에서 생활하는 염소과 동물입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Alpine_ibex.jpg?width=700"], ["플라밍고", "남부 프랑스의 습지와 연안에서 볼 수 있는 긴 다리의 물새입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Greater_flamingo.jpg?width=700"], ["라벤더", "프랑스 남부에서 널리 재배되는 향기로운 식물로 여름철 보랏빛 들판이 유명합니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Lavender_field.jpg?width=700"], ["포도나무", "프랑스 여러 지역에서 재배되며 포도와 다양한 식품·음료 문화와 연결됩니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Vineyard_France.jpg?width=700"]], "places": [["에펠탑", "파리의 센강 주변에 있는 철제 탑으로 프랑스를 상징하는 대표적인 건축물입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Eiffel_Tower.jpg?width=700"], ["루브르 박물관", "세계적으로 유명한 미술관으로 다양한 시대와 지역의 예술 작품을 소장하고 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Louvre_Museum_Wikimedia_Commons.jpg?width=700"], ["베르사유 궁전", "프랑스 왕실의 대표적인 궁전으로 화려한 건축과 정원으로 유명합니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Palace_of_Versailles.jpg?width=700"], ["몽생미셸", "바닷가의 작은 섬 위에 수도원과 마을이 자리한 독특한 역사 경관입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Mont-Saint-Michel.jpg?width=700"]], "culture": [["패션", "파리는 오랫동안 세계 패션의 중심지 가운데 하나로 꼽히며 여러 유명 패션 행사가 열립니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Paris_Fashion_Week.jpg?width=700"], ["미술", "인상주의를 비롯한 여러 미술 흐름이 발전했고 많은 미술관이 작품을 보존하고 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Impression_Sunrise.jpg?width=700"], ["카페 문화", "카페에서 커피와 빵을 먹으며 사람들과 이야기하거나 책과 신문을 읽는 생활문화가 발달했습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Paris_cafe.jpg?width=700"], ["프랑스 혁명 기념문화", "프랑스 혁명은 자유·평등과 시민의 권리 등에 대한 생각이 확산되는 과정에서 중요한 역사적 사건으로 기억됩니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Bastille_Day_Paris.jpg?width=700"]]}, "EG": {"name": "이집트", "capital": "카이로", "area": "약 100만㎢", "population": "약 1억 1,800만 명", "language": "아랍어", "script": "아랍 문자", "currency": "이집트 파운드(EGP)", "location": "아프리카 북동부에 있으며 지중해와 홍해 사이에 자리합니다. 시나이반도는 아시아에 속합니다.", "climate": "대부분이 건조한 사막 기후이며 나일강 주변에는 물과 농경지가 집중되어 있습니다.", "languageText": "아랍어가 주된 언어이며 아랍 문자를 사용합니다. 이집트에서는 이집트 아랍어가 일상생활에서 널리 사용됩니다.", "capitalText": "카이로는 이집트의 수도이며 나일강을 따라 크게 발달한 도시입니다. 고대 유산과 현대 도시가 가까이 공존합니다.", "natureText": "국토 대부분은 사막이지만 나일강 계곡과 삼각주에는 농경지가 발달했습니다. 홍해 연안에는 산호초와 해양 생태계가 있습니다.", "flag": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag%20of%20Egypt.svg", "map": "https://commons.wikimedia.org/wiki/Special:FilePath/Egypt%20location%20map.svg", "worldmap": "https://commons.wikimedia.org/wiki/Special:FilePath/Egypt%20%28orthographic%20projection%29.svg", "mapNote": "나일강과 사막, 지중해·홍해의 위치를 함께 살펴볼 수 있습니다.", "foodIntro": "밀·쌀·콩·채소 등을 활용하는 음식이 많으며 지중해와 중동, 아프리카의 음식문화가 함께 나타납니다.", "animalsIntro": "사막과 나일강, 홍해의 산호초 등 환경에 따라 서로 다른 생물이 살아갑니다.", "placesIntro": "피라미드와 신전 같은 고대 유적과 나일강, 사막, 홍해의 자연환경이 주요 명소입니다.", "cultureIntro": "고대 이집트 문명과 이슬람 문화, 현대 아랍 문화가 함께 이어지고 있습니다.", "history": [["기원전 3100년경", "상·하 이집트가 통일되면서 고대 이집트 왕국의 기초가 마련되었습니다."], ["기원전 2560년경", "기자의 대피라미드가 건설된 시기로 알려져 있습니다."], ["기원전 332년", "알렉산드로스 대왕이 이집트를 정복했습니다."], ["기원전 30년", "로마의 지배가 시작되었습니다."], ["641년", "아랍 세력이 이집트를 정복하면서 이슬람 문화가 크게 확산되었습니다."], ["1517년", "오스만 제국의 지배를 받게 되었습니다."], ["1922년", "이집트 왕국이 독립을 선언했습니다."], ["1953년", "이집트 공화국이 수립되었습니다."]], "food": [["코샤리", "쌀·렌틸콩·파스타·병아리콩 등을 함께 담고 토마토 소스 등을 곁들여 먹는 대중 음식입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Koshari.jpg?width=700"], ["풀 메담메스", "삶은 잠두콩을 양념해 먹는 음식으로 이집트에서 널리 먹습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Ful_medames.jpg?width=700"], ["팔라펠", "콩류를 갈아 향신료와 함께 반죽한 뒤 튀겨 먹는 음식으로 이집트에서도 친숙합니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Falafel.jpg?width=700"], ["몰로키야", "몰로키야 잎을 잘게 썰어 국물과 함께 끓여 먹는 전통 음식입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Molokhia.jpg?width=700"]], "animals": [["나일악어", "나일강과 아프리카의 여러 수역에 사는 큰 악어로 물가 생태계의 대표적인 포식자입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Nile_crocodile.jpg?width=700"], ["낙타", "건조한 지역에서 생활에 이용되어 온 동물로 사막 환경에 적응한 특징이 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Camel.jpg?width=700"], ["홍해 산호초", "홍해에는 다양한 산호와 물고기가 살아가는 해양 생태계가 발달해 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Red_Sea_coral_reef.jpg?width=700"], ["대추야자", "건조한 지역에서도 자랄 수 있어 나일강 주변과 오아시스 등에서 중요한 작물로 이용되어 왔습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Date_palm.jpg?width=700"]], "places": [["기자의 피라미드", "고대 이집트의 거대한 무덤 건축물로 쿠푸왕의 대피라미드 등이 남아 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Pyramids_of_Giza.jpg?width=700"], ["스핑크스", "사람의 머리와 사자의 몸을 가진 거대한 석조 조각으로 기자의 피라미드 주변에 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Great_Sphinx_of_Giza.jpg?width=700"], ["룩소르 신전", "고대 테베 지역에 세워진 거대한 신전 유적으로 나일강 동쪽에 자리합니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Luxor_Temple.jpg?width=700"], ["나일강", "아프리카를 북쪽으로 흐르며 이집트의 농업과 도시 발달에 오랫동안 중요한 역할을 해 온 강입니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Nile_River.jpg?width=700"]], "culture": [["상형문자", "고대 이집트에서 사용된 그림 모양의 문자 체계로 신전과 무덤 등에 많이 남아 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Egyptian_hieroglyphs.jpg?width=700"], ["고대 이집트 미술", "사람과 신, 동물 등을 일정한 규칙과 자세로 표현한 벽화와 조각이 많이 남아 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Egyptian_art.jpg?width=700"], ["이슬람 건축", "모스크와 학교 등에서 기하학적 무늬와 아치, 돔 등을 활용한 건축 전통이 발달했습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Islamic_architecture_Cairo.jpg?width=700"], ["현대 이집트 음악", "아랍 음악 전통과 현대 대중음악이 함께 발전해 다양한 음악을 즐길 수 있습니다.", "https://commons.wikimedia.org/wiki/Special:FilePath/Egyptian_music.jpg?width=700"]]}};

function closeCountryList(e){if(e.target.id==="countryModal"||e.target.classList.contains("close-list"))document.getElementById("countryModal").classList.remove("open");}
function selectCountry(code){COUNTRY=code;localStorage.setItem("selected_country",code);document.getElementById("countryModal").classList.remove("open");renderApp();}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"key"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function getPhoto(section,id){const db=await openDB();return new Promise(resolve=>{const q=db.transaction(STORE,"readonly").objectStore(STORE).get(`${COUNTRY}|${section}|${id}`);q.onsuccess=()=>resolve(q.result?.photo||"");q.onerror=()=>resolve("")})}
async function savePhoto(section,id,photo){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put({key:`${COUNTRY}|${section}|${id}`,country:COUNTRY,section,id,photo});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function customKey(section){return `custom_${COUNTRY}_${section}`} function editKey(section,id){return `edit_${COUNTRY}_${section}_${id}`}
function getCustom(section){try{return JSON.parse(localStorage.getItem(customKey(section))||"[]")}catch{return[]}}
function getEditedDesc(section,id,original){return localStorage.getItem(editKey(section,id))??original}
function setEditedDesc(section,id,desc){localStorage.setItem(editKey(section,id),desc)} function removeEditedDesc(section,id){localStorage.removeItem(editKey(section,id))}
const foreignNoise=/(포르투갈어|포르투갈|영어로|영어권|스페인어|프랑스어|독일어|이탈리아어|러시아어|일본어|중국어|아랍어|라틴어|그리스어|터키어|힌디어|베트남어|태국어|폴란드어|체코어|헝가리어|루마니아어|우크라이나어|다른 언어에서는|외국에서는)/i;
const childUnsafe=/(성적|성행위|음란|포르노|욕설|심한 욕|비속어|외설|자살|살인|고문|잔인|폭력적인 묘사|마약|약물 남용)/i;
function cleanAutoDescription(text){if(!text)return "";let t=text.replace(/\s+/g," ").trim();let sentences=t.split(/(?<=[.!?。！？])\s+/).map(x=>x.trim()).filter(Boolean);let kept=[];for(const sentence of sentences){if(foreignNoise.test(sentence)||childUnsafe.test(sentence))continue;kept.push(sentence);if(kept.length>=4)break}return kept.join(" ").trim()}
async function lookupWikipedia(name){for(const base of ["https://ko.wikipedia.org/api/rest_v1/page/summary/","https://en.wikipedia.org/api/rest_v1/page/summary/"]){try{const r=await fetch(base+encodeURIComponent(name),{headers:{Accept:"application/json"}});if(r.ok){const j=await r.json();if(j.extract){const cleaned=cleanAutoDescription(j.extract);if(cleaned)return cleaned}}}catch(e){}}return ""}
function relationCheck(name,auto){const c=(name+" "+auto).toLowerCase();const d=COUNTRIES[COUNTRY].name.toLowerCase();return c.includes(d)||c.includes(COUNTRY==="JP"?"japan":COUNTRY==="CN"?"china":COUNTRY==="US"?"america":COUNTRY==="FR"?"france":COUNTRY==="EG"?"egypt":"korea")||COUNTRIES[COUNTRY].food.some(x=>c.includes(x[0].toLowerCase()))}
async function addItem(section){const name=prompt("추가할 항목의 이름을 입력하세요.");if(!name?.trim())return;const n=name.trim(),auto=await lookupWikipedia(n);const related=relationCheck(n,auto);if(!related&&!confirm(`이 항목은 ${COUNTRIES[COUNTRY].name}과의 연관성을 확인하기 어렵습니다.\n그래도 추가하시겠습니까?`))return;const desc=auto||prompt("기본 설명을 검색하지 못했습니다. 설명을 직접 입력하시겠습니까?")||"기본 설명이 아직 입력되지 않았습니다.";const arr=getCustom(section);arr.push({id:"u"+Date.now(),name:n,desc:desc.trim(),unrelated:!related});localStorage.setItem(customKey(section),JSON.stringify(arr));renderItems(section)}
function editDescription(section,x){const current=getEditedDesc(section,x.id,x.desc);const next=prompt("이 항목의 설명을 수정하세요.\n\n아이에게 보여줄 설명만 적어 주세요.",current);if(next===null)return;const v=next.trim();if(!v){alert("설명은 비워 둘 수 없습니다.");return}setEditedDesc(section,x.id,v);renderItems(section)}
function resetDescription(section,x){if(!confirm("원래 설명으로 되돌릴까요?"))return;removeEditedDesc(section,x.id);renderItems(section)}
async function renderItems(section){const el=document.getElementById(section+"List");if(!el)return;el.innerHTML="";const built=COUNTRIES[COUNTRY][section].map((x,i)=>({id:"b"+i,name:x[0],desc:x[1],src:x[2],mine:false}));const customs=getCustom(section).map(x=>({id:x.id,name:x.name,desc:x.desc,src:"",mine:true,unrelated:!!x.unrelated}));for(const x of [...built,...customs]){const p=await getPhoto(section,x.id);const shown=p||x.src;const desc=getEditedDesc(section,x.id,x.desc);const card=document.createElement("article");card.className="item";card.innerHTML=`<h3>${esc(x.name)}${x.unrelated?'<span class="related-status">이 나라와 관련성 부족</span>':''}</h3><div class="photo-area">${shown?`<img src="${shown}" alt="${esc(x.name)}">`:`<span class="empty">사진을 추가할 수 있습니다.</span>`}</div><p>${esc(desc)}</p>${x.mine?'<span class="mine">내가 추가한 내용</span>':''}<div class="actions"><div class="action-left"><button type="button">사진 등록 / 바꾸기</button><input type="file" accept="image/*" hidden></div><div class="action-right"><button type="button" class="edit-desc">설명 수정</button>${!x.mine?'<button type="button" class="reset-desc">원래 설명으로</button>':''}${x.mine?'<button type="button" class="delete">항목 삭제</button>':''}</div></div>`;card.querySelector(".edit-desc").onclick=()=>editDescription(section,x);if(!x.mine)card.querySelector(".reset-desc").onclick=()=>resetDescription(section,x);const input=card.querySelector("input"),photoButton=card.querySelector(".action-left button");photoButton.onclick=()=>input.click();input.onchange=async()=>{const f=input.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=async()=>{await savePhoto(section,x.id,reader.result);await renderItems(section)};reader.readAsDataURL(f)};if(x.mine)card.querySelector(".delete").onclick=async()=>{if(!confirm("이 항목을 삭제할까요?"))return;const arr=getCustom(section).filter(y=>y.id!==x.id);localStorage.setItem(customKey(section),JSON.stringify(arr));removeEditedDesc(section,x.id);await savePhoto(section,x.id,"");await renderItems(section)};el.appendChild(card)}}
function renderCountryList(){const g=document.getElementById("countryGrid");g.innerHTML="";ORDER.forEach(code=>{const b=document.createElement("button");b.className="country-choice"+(code===COUNTRY?" active":"");b.textContent=COUNTRIES[code].name;b.onclick=()=>selectCountry(code);g.appendChild(b)})}
function renderApp(){const d=COUNTRIES[COUNTRY];document.getElementById("countryName").textContent=d.name;const nav=document.getElementById("nav");nav.innerHTML=Object.entries(sectionNames).map(([k,v])=>`<a href="#${k}">${v}</a>`).join("");document.getElementById("app").innerHTML=`
<section id="basic"><h2>1. 기본정보</h2><div class="info-grid"><div class="info"><b>나라 이름</b>${d.name}</div><div class="info"><b>위치</b>${d.location}</div><div class="info"><b>수도</b>${d.capital}</div><div class="info"><b>면적</b>${d.area}</div><div class="info"><b>인구</b>${d.population}</div><div class="info"><b>언어</b>${d.language}</div><div class="info"><b>문자</b>${d.script}</div><div class="info"><b>화폐</b>${d.currency}</div></div><p class="note">인구·면적은 나라별 공식 통계 또는 국제기구의 최신 이용 가능 자료를 기준으로 정리했으며, 자료의 기준일이 서로 다를 수 있습니다.</p></section>
<section id="map"><h2>2. 실제 지도</h2><div class="map-grid"><div class="map-card"><h3>${d.name} 위치 지도</h3><div class="map-image"><img src="${d.map}" alt="${d.name} 위치 지도"></div><p class="map-note">${d.mapNote}</p></div><div class="map-card"><h3>세계 지도에서 바라본 ${d.name}</h3><div class="map-image world-wrap"><img src="${d.worldmap}" alt="${d.name} 세계 위치 지도"><button class="zoom-map" onclick="openMapZoom()">확대해서 보기</button></div><p class="map-note">지구에서 이 나라가 어느 지역에 있는지 살펴볼 수 있습니다.</p></div></div></section>
<section id="flag"><h2>3. 국기</h2><img class="flag" src="${d.flag}" alt="${d.name} 국기"><p>${flagText(d)}</p></section>
<section id="capital"><h2>4. 수도 설명</h2><h3>${d.capital}</h3><p>${d.capitalText}</p></section>
<section id="nature"><h2>5. 자연과 기후</h2><p>${d.natureText}</p><p>${d.climate}</p></section>
<section id="language"><h2>6. 언어와 문자</h2><p>${d.languageText}</p></section>
<section id="food"><h2>7. 음식</h2><p class="section-intro">${d.foodIntro}</p><div class="cards" id="foodList"></div><button class="add-btn" onclick="addItem('food')">항목 추가</button></section>
<section id="animals"><h2>8. 동식물</h2><p class="section-intro">${d.animalsIntro}</p><div class="cards" id="animalsList"></div><button class="add-btn" onclick="addItem('animals')">항목 추가</button></section>
<section id="places"><h2>9. 전국의 명소</h2><p class="section-intro">${d.placesIntro}</p><div class="cards" id="placesList"></div><button class="add-btn" onclick="addItem('places')">항목 추가</button></section>
<section id="culture"><h2>10. 대표 문화</h2><p class="section-intro">${d.cultureIntro}</p><div class="cards" id="cultureList"></div><button class="add-btn" onclick="addItem('culture')">항목 추가</button></section>
<section id="history"><h2>11. 한눈에 보는 ${d.name} 역사</h2><div class="event-grid">${d.history.map(x=>`<div class="event"><b>${x[0]}</b><br>${x[1]}</div>`).join("")}</div></section>
<section id="sources"><h2>12. 자료를 확인한 곳</h2><div class="source-box"><ul class="source-list"><li>대한민국·일본 등 국가별 정부 공식 자료</li><li>국제연합(UN) 회원국 자료</li><li>세계은행(World Bank) 통계</li><li>Wikimedia Commons의 지도·사진 자료</li></ul><p class="note">실제 수치와 역사·문화 설명은 나라별 공식 자료와 국제기구 자료를 우선하고, 사진과 지도는 Wikimedia Commons 자료를 활용했습니다.</p></div></section>`;
document.documentElement.style.scrollPaddingTop=((document.querySelector("header")?.offsetHeight||150)+8)+"px";["food","animals","places","culture"].forEach(renderItems);}
function flagText(d){const t={KR:"태극기는 흰 바탕 가운데 태극 문양과 네 괘가 배치되어 있습니다.",JP:"일장기는 흰 바탕 가운데 붉은 원이 있어 태양을 상징합니다.",CN:"중국 국기는 붉은 바탕에 큰 노란 별 하나와 작은 별 네 개가 있습니다.",US:"미국 국기는 별과 줄무늬로 이루어져 있으며 주를 나타내는 별과 13개의 줄이 있습니다.",FR:"프랑스 국기는 파랑·흰색·빨강의 세 세로 띠로 이루어져 있습니다.",EG:"이집트 국기는 빨강·흰색·검정의 세 가로 띠와 가운데 국장을 담고 있습니다."};return t[COUNTRY]||"이 나라의 국기는 나라의 역사와 상징을 담고 있습니다.";}
function openMapZoom(){const d=COUNTRIES[COUNTRY];const modal=document.createElement("div");modal.className="country-modal open";modal.id="mapZoomModal";modal.innerHTML=`<div class="country-panel" style="max-width:900px;text-align:center"><button class="close-list" onclick="document.getElementById('mapZoomModal')?.remove()">×</button><h2>${d.name} 실제 지도</h2><img src="${d.worldmap}" alt="${d.name} 확대 지도" style="max-width:100%;max-height:75vh;object-fit:contain"></div>`;document.body.appendChild(modal);}
const savedTitle=localStorage.getItem("world_country_title");if(savedTitle)document.getElementById("appTitle").textContent=savedTitle;
renderCountryList();renderApp();
window.addEventListener("resize",()=>document.documentElement.style.scrollPaddingTop=((document.querySelector("header")?.offsetHeight||150)+8)+"px");
</script></body></html>
