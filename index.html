 {id:'symbols',title:'🇰🇷 대한민국을 나타내는 것들',intro:'국가를 상징하는 것에는 국기와 국가, 국화처럼 나라를 대표하는 상징이 있어요.',cards:[
  ['태극기','흰 바탕에 태극 문양과 네 개의 괘가 있는 대한민국의 국기예요.','태극기'],
  ['애국가','대한민국의 국가로 사용되는 노래예요.','애국가'],
  ['무궁화','우리나라를 상징하는 꽃으로 널리 알려져 있어요.','무궁화'],
  ['태극 문양','음과 양의 조화를 나타내는 태극 문양은 태극기의 가운데에 들어 있어요.','태극기'] ]}
 ]};

let selected=JSON.parse(localStorage.getItem(PREFIX+'selected')||'[]');
let custom=JSON.parse(localStorage.getItem(PREFIX+'custom')||'[]');
const photoCache={};
function save(){localStorage.setItem(PREFIX+'selected',JSON.stringify(selected));localStorage.setItem(PREFIX+'custom',JSON.stringify(custom));}
function imgUrl(title){return 'https://ko.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title)}
async function loadPhoto(img,title){
 if(!title)return;
 try{const r=await fetch(imgUrl(title),{signal:AbortSignal.timeout(5000)});const d=await r.json();const u=d.thumbnail?.source||d.originalimage?.source;if(u){img.src=u;img.dataset.loaded='1';return}}catch(e){}
 img.alt=title; img.style.background='linear-gradient(135deg,#e8f1ff,#fff1c9)';
}
function cardHTML(item,section){const [name,desc,photo]=item;const key=section+'|'+name;return `<article class="card"><div class="thumb"><img data-photo="${esc(photo)}" alt="${esc(name)}"></div><div class="cardBody"><span class="tag">${esc(section)}</span><h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="actions"><button class="btn blue" onclick='openDetail(${JSON.stringify(section)},${JSON.stringify(name)},${JSON.stringify(desc)},${JSON.stringify(photo)})'>자세히 보기</button><button class="btn primary" onclick='addSelected(${JSON.stringify(section)},${JSON.stringify(name)},${JSON.stringify(desc)},${JSON.stringify(photo)})'>＋ 설명카드에 넣기</button></div></div></article>`}
function render(){
 const nav=document.getElementById('nav'), box=document.getElementById('sections');
 nav.innerHTML='';box.innerHTML='';
 DATA.basic.items.forEach((x,i)=>{});
 DATA.sections.forEach(s=>{nav.innerHTML+=`<button onclick="document.getElementById('${s.id}').scrollIntoView({behavior:'smooth',block:'start'})">${s.title.replace(/^\S+\s/,'')}</button>`;box.innerHTML+=`<section id="${s.id}"><h2 class="sectionTitle">${s.title}</h2><div class="intro">${s.intro}</div><div class="grid">${s.cards.map(c=>cardHTML(c,s.title)).join('')}</div></section>`});
 box.insertAdjacentHTML('afterbegin',`<section id="basic"><h2 class="sectionTitle">🌍 한눈에 알아보기</h2><div class="facts">${DATA.basic.items.map(x=>`<div class="fact"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div><div class="intro">대한민국을 처음 만났다면 여기부터 천천히 살펴보세요. 숫자를 외우기보다 “어떤 나라일까?”를 알아가는 것이 목적이에요.</div></section>`);
 document.querySelectorAll('img[data-photo]').forEach(i=>loadPhoto(i,i.dataset.photo));
 renderMyCards();
}
function openDetail(section,name,desc,photo){document.getElementById('home').style.display='none';const d=document.getElementById('detail');d.style.display='block';document.getElementById('detailBody').innerHTML=`<div class="detailPanel"><img data-detail-photo="${esc(photo)}" alt="${esc(name)}"><div class="detailContent"><span class="tag">${esc(section)}</span><h2>${esc(name)}</h2><p>${esc(desc)}</p><h3>💡 알아두면 좋은 점</h3><p>${detailMore(name)}</p><div class="actions"><button class="btn primary" onclick='addSelected(${JSON.stringify(section)},${JSON.stringify(name)},${JSON.stringify(desc)},${JSON.stringify(photo)})'>＋ 이 내용을 내 설명카드에 넣기</button></div>${quizHTML(name)}</div></div>`;loadPhoto(document.querySelector('[data-detail-photo]'),photo);window.scrollTo(0,0)}
function detailMore(n){const m={
'한글':'1443년 세종이 훈민정음을 반포했고, 오늘날 우리가 사용하는 한글의 바탕이 되었어요.',
'김치':'김치는 재료와 지역에 따라 맛과 종류가 다양하며, 발효 과정에서 맛이 달라져요.',
'한복':'오늘날에는 전통적인 형태뿐 아니라 현대 생활에 맞게 디자인한 한복도 볼 수 있어요.',
'경복궁':'경복궁은 조선 왕조의 주요 궁궐 가운데 하나이며 서울의 대표적인 역사 공간이에요.',
'한라산':'한라산은 제주도의 자연환경과 화산 지형을 이해하는 데 중요한 산이에요.',
'김장':'김장은 가족이나 이웃이 함께 김치를 준비하던 공동체 문화와도 연결되어 있어요.'};return m[n]||'이 항목은 대한민국의 자연·역사·생활·문화 모습을 이해하는 데 도움이 되는 대표적인 내용이에요.'}
function quizHTML(name){const q={
'한글':['한글은 무엇을 하는 데 사용하는 문자일까요?',['한국어를 적어요','음식을 만들어요','산의 높이를 재요'],0],
'경복궁':['경복궁은 어떤 곳일까요?',['조선의 궁궐이에요','바다에 있는 섬이에요','과일을 재배하는 농장이에요'],0],
'김치':['김치는 어떤 특징이 있을까요?',['채소 등을 양념하고 발효시켜 먹기도 해요','항상 달콤한 음료예요','돌로 만든 건축물이에요'],0],
'한라산':['한라산은 어디에 있을까요?',['제주도에 있어요','서울 한가운데 있어요','서해 바닷속에 있어요'],0],
'설날':['설날에 볼 수 있는 풍습은 무엇일까요?',['세배와 떡국 등이 있어요','바다에서 배를 만드는 날이에요','학교 운동회를 하는 날이에요'] ,0]};
if(!q[name])return '';const [question,opts,ans]=q[name];const id='q'+Math.random().toString(36).slice(2);return `<div class="quiz"><b>🔎 내가 알아본 것을 골라 볼까요?</b><p>${question}</p>${opts.map((o,i)=>`<button onclick="answerQuiz(this,${i},${ans})">${i+1}. ${o}</button>`).join('')}<div class="quizResult" id="${id}"></div></div>`}
function answerQuiz(btn,i,ans){const box=btn.parentElement;box.querySelectorAll('button').forEach(b=>b.classList.remove('selected','correct','wrong'));btn.classList.add('selected');setTimeout(()=>{if(i===ans){btn.classList.add('correct');box.querySelector('.quizResult').textContent='🎉 맞았어요! 내가 알아본 내용을 설명카드에 넣어 보세요.'}else{btn.classList.add('wrong');box.querySelector('.quizResult').textContent='한 번 더 생각해 볼까요? 위 설명을 다시 읽어 보세요.'}},250)}
function addSelected(section,name,desc,photo){const key=section+'|'+name;if(!selected.some(x=>x.key===key)){selected.push({key,section,name,desc,photo});save();renderMyCards();}document.getElementById('myMaker').scrollIntoView({behavior:'smooth',block:'start'});}
function removeSelected(key){selected=selected.filter(x=>x.key!==key);save();renderMyCards()}
function renderMyCards(){const list=document.getElementById('selectedList'),cards=document.getElementById('myCards');if(!list)return;list.innerHTML=selected.map(x=>`<span class="pill">${esc(x.name)} <button onclick="removeSelected(${JSON.stringify(x.key)})">×</button></span>`).join('');cards.innerHTML=selected.length?selected.map(x=>`<div class="myCard"><div class="big">${esc(x.name)}</div><div class="mini">${esc(x.section)}</div><p>${esc(x.desc)}</p><button class="btn green" onclick="openDetail(${JSON.stringify(x.section)},${JSON.stringify(x.name)},${JSON.stringify(x.desc)},${JSON.stringify(x.photo)})">이 내용 다시 보기</button> <button class="btn red" onclick="removeSelected(${JSON.stringify(x.key)})">카드에서 빼기</button></div>`).join(''):'<div class="empty">아직 고른 내용이 없어요.<br>위 백과사전에서 궁금한 항목을 골라 보세요.</div>'}
function goHome(){document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block';window.scrollTo(0,0)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();loadPhoto(document.querySelector('[data-photo="대한민국"]'),'대한민국');
</script>
</body></html>
