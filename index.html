const KOREA_BASE_DATA={
food:[
["김치","배추·무 등의 채소를 소금에 절인 뒤 고춧가루, 마늘, 생강 등의 양념을 넣어 발효시키는 한국의 대표적인 음식입니다. 재료와 양념, 만드는 방법에 따라 배추김치·깍두기·동치미 등 여러 종류가 있습니다. 김치는 밥과 함께 반찬으로 먹기도 하고 김치찌개·김치볶음밥처럼 다른 음식의 재료로도 활용합니다. 김장을 통해 가족이나 이웃이 함께 김치를 준비하고 나누는 문화도 이어져 왔습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Kimchi.jpg?width=700"],
["비빔밥","따뜻한 밥 위에 여러 나물과 채소, 고기, 달걀 등의 재료를 올리고 양념을 넣어 비벼 먹는 한국 음식입니다. 재료의 색과 맛을 한 그릇에 조화롭게 담는 것이 특징이며, 지역과 재료에 따라 여러 형태가 있습니다. 돌솥비빔밥처럼 뜨거운 그릇에 담아 밥의 일부를 눌어붙게 해서 먹기도 합니다. 여러 가지 재료를 한 번에 먹을 수 있어 한국 음식의 다양성을 보여주는 음식으로 알려져 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Bibimbap.jpg?width=700"],
["불고기","소고기나 돼지고기 등을 얇게 썰어 간장, 설탕, 마늘, 참기름 등의 양념에 재운 뒤 구워 먹거나 국물이 조금 있는 방식으로 익혀 먹는 음식입니다. 고기에 양념이 배도록 미리 재우는 것이 특징이며 양파·버섯·파 같은 채소를 함께 넣기도 합니다. 지역과 가정에 따라 양념의 단맛과 조리 방법이 조금씩 다릅니다. 밥과 함께 먹는 대표적인 한국 고기 음식 가운데 하나입니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Bulgogi.jpg?width=700"],
["냉면","메밀이나 전분 등을 이용해 만든 면을 차가운 육수 또는 매콤한 양념과 함께 먹는 한국의 면 요리입니다. 대표적으로 물냉면과 비빔냉면이 있으며, 지역에 따라 면의 재료와 육수, 양념이 다릅니다. 평양냉면은 담백한 육수를 사용하는 것으로 알려져 있고, 함흥냉면은 감자나 고구마 전분을 사용한 쫄깃한 면과 매콤한 양념이 특징입니다. 더운 계절에 많이 찾지만 계절과 관계없이 먹을 수 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Naengmyeon.jpg?width=700"],
["떡","쌀이나 다른 곡식을 가루로 만들어 찌거나 삶고 빚어서 만드는 한국의 전통 음식입니다. 백설기·송편·인절미·가래떡 등 종류가 매우 많으며 재료와 만드는 방법에 따라 맛과 모양이 달라집니다. 명절이나 생일, 잔치 같은 특별한 날에 먹는 음식으로도 오랫동안 사랑받아 왔습니다. 떡볶이처럼 다른 음식의 재료로 사용되는 떡도 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Tteok.jpg?width=700"],
["잡채","고구마 전분으로 만든 당면에 시금치·당근·양파·버섯 같은 채소와 고기 등을 넣고 간장 양념으로 볶아 만드는 음식입니다. 재료를 각각 알맞게 익힌 뒤 함께 섞어 만드는 경우가 많아 여러 색과 식감이 어우러집니다. 명절이나 잔치, 가족 모임에서 자주 차려지는 음식이며 따뜻하게 먹거나 식혀서 먹기도 합니다. 재료를 다양하게 넣을 수 있어 가정과 지역에 따라 모습이 조금씩 다릅니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Japchae.jpg?width=700"],
["호떡","밀가루 등을 이용한 반죽 안에 설탕과 계피, 견과류 등을 넣고 납작하게 눌러 기름에 구워 먹는 한국의 간식입니다. 뜨거울 때 속의 설탕이 녹아 달콤한 시럽처럼 되는 것이 특징입니다. 겨울철 길거리 간식으로 특히 많이 알려져 있으며 씨앗이나 채소 등을 넣는 여러 종류의 호떡도 있습니다. 지역과 가게에 따라 반죽과 속재료의 맛이 달라질 수 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Hotteok.jpg?width=700"],
["고추장","고춧가루와 곡물, 메줏가루, 소금 등을 이용해 발효시키는 한국의 전통 장류입니다. 매운맛뿐 아니라 단맛과 감칠맛도 있어 비빔밥·떡볶이·찌개·양념장 등 여러 음식에 사용합니다. 재료의 비율과 숙성 기간에 따라 맛과 색이 달라질 수 있습니다. 한국 음식에서 양념과 맛을 더하는 중요한 재료 가운데 하나입니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Gochujang.jpg?width=700"]
],
animals:[
["호랑이","호랑이는 한반도에서 오랫동안 살아온 대표적인 야생 동물이며 우리나라의 전통 그림과 이야기에도 자주 등장합니다. 몸에 검은 줄무늬가 있고 숲과 산악 지역에서 생활하는 대형 고양잇과 동물입니다. 과거 한반도 여러 지역에 분포했지만 현재 대한민국의 야생에서는 사실상 관찰하기 어렵습니다. 우리나라의 자연과 전통문화를 상징하는 동물로 자주 소개됩니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Siberian_Tiger.jpg?width=700"],
["반달가슴곰","반달가슴곰은 가슴에 반달 모양의 흰 무늬가 있어 이런 이름이 붙은 곰입니다. 주로 산림에서 생활하며 나무를 잘 타고 식물의 열매와 여러 먹이를 먹습니다. 우리나라에서는 지리산을 중심으로 복원 사업이 이루어지고 있으며 야생에서 살아갈 수 있도록 보호하고 있습니다. 산림 생태계의 한 구성원으로서 자연환경을 이해하는 데 중요한 동물입니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Ursus_thibetanus_ussuricus.jpg?width=700"],
["두루미","두루미는 긴 다리와 긴 목을 가진 큰 새로 습지와 논, 강 주변에서 관찰되는 대표적인 겨울 철새입니다. 우리나라에서는 추운 계절에 여러 습지를 찾아오는 모습을 볼 수 있으며, 얕은 물과 논 주변에서 먹이를 찾습니다. 몸의 대부분이 흰색이고 머리 윗부분에 붉은색 피부가 보이는 것이 특징입니다. 서식지가 줄어들지 않도록 보호가 필요한 새로 알려져 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Red-crowned%20crane.jpg?width=700"],
["수달","수달은 강과 하천, 호수 주변에서 생활하는 포유류로 물속에서 움직이기에 알맞은 몸을 가지고 있습니다. 물고기와 여러 수생 생물을 먹으며 물가에 굴이나 은신처를 마련해 생활합니다. 우리나라에서도 하천과 해안 주변에서 살아가지만 깨끗하고 먹이가 충분한 서식지가 필요합니다. 수달의 모습과 생활을 살펴보면 하천 생태계의 중요성도 함께 생각할 수 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Otter.jpg?width=700"],
["무궁화","무궁화는 대한민국을 상징하는 꽃으로 널리 알려진 낙엽성 관목입니다. 여름철에 분홍색·흰색 등 여러 색의 꽃을 피우며 꽃이 짧은 시간 동안 피고 지는 특징이 있습니다. 우리나라 곳곳에서 관상용으로 심으며 나라꽃을 상징하는 식물로 오랫동안 알려져 왔습니다. 꽃과 잎의 모습을 살펴보면 우리나라의 식물 가운데 어떤 특징이 있는지 알아볼 수 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Hibiscus_syriacus.jpg?width=700"],
["소나무","소나무는 우리나라 산과 들에서 흔히 볼 수 있는 대표적인 상록수입니다. 바늘처럼 생긴 잎이 두 개씩 모여 달리고, 줄기가 붉은빛을 띠는 경우가 많습니다. 추운 겨울에도 잎을 유지하기 때문에 사계절의 자연을 살펴볼 때 눈에 잘 띄는 나무입니다. 예부터 생활 재료와 그림, 문학 등에 자주 등장해 우리 문화와도 친숙한 나무입니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Pinus_densiflora.jpg?width=700"],
["벼","벼는 논에서 재배하여 쌀을 얻는 곡식으로 우리나라 식생활과 매우 밀접한 식물입니다. 따뜻한 계절에 자라며 물을 댄 논에서 재배하는 모습이 우리 농촌의 대표적인 풍경 가운데 하나입니다. 벼가 익으면 이삭의 색이 초록색에서 누런색으로 변하고, 수확한 벼에서 왕겨를 벗기면 우리가 먹는 쌀을 얻을 수 있습니다. 밥과 여러 쌀 음식의 기본 재료가 되는 중요한 농작물입니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Rice%20paddy%20in%20Korea.jpg?width=700"],
["제주도의 식물","제주도에는 따뜻한 기후와 화산 지형의 영향을 받은 다양한 식물이 자랍니다. 해안 지역과 중산간 지역, 한라산의 높은 곳은 기온과 바람이 달라 서로 다른 식물들이 나타납니다. 돌담 주변이나 오름, 숲 등에서도 제주도 특유의 식물 모습을 관찰할 수 있습니다. 제주도의 식물을 살펴보면 섬의 기후와 지형이 생물의 생활에 어떤 영향을 주는지도 알 수 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Jeju%20Island%20forest.jpg?width=700"]
],
places:[
["경복궁","경복궁은 조선 왕조의 법궁으로 1395년에 처음 지어졌습니다. 왕이 나라의 중요한 일을 처리하고 생활하던 중심 궁궐이며 근정전·경회루·향원정 등 여러 건물이 있습니다. 임진왜란 때 크게 훼손되었고 이후 여러 차례 복원되면서 현재의 모습을 갖추어 가고 있습니다. 궁궐의 건물과 연못, 정원을 함께 살펴보면 조선 시대 왕실의 공간 구성을 이해하는 데 도움이 됩니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Gyeongbokgung%20Palace.png?width=700"],
["창덕궁","창덕궁은 조선 시대에 지어진 궁궐로 자연 지형을 크게 바꾸지 않고 건물을 배치한 것이 특징입니다. 궁궐의 전각뿐 아니라 뒤쪽의 넓은 정원인 후원도 잘 알려져 있습니다. 건물과 자연이 조화를 이루는 공간 구성 때문에 조선 궁궐의 모습을 이해하는 데 중요한 장소입니다. 유네스코 세계유산으로 등재되어 있어 세계적으로도 문화유산의 가치를 인정받고 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Changdeokgung.jpg?width=700"],
["불국사","불국사는 경상북도 경주에 있는 신라 시대의 대표적인 불교 사찰입니다. 대웅전으로 이어지는 계단과 석가탑·다보탑 등 여러 문화유산이 함께 남아 있습니다. 신라의 건축과 불교문화를 이해할 수 있는 중요한 장소이며 석굴암과 함께 유네스코 세계유산으로 등재되어 있습니다. 건물과 석조물의 배치에서 신라인들이 만든 건축 기술과 아름다움을 살펴볼 수 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Bulguksa.jpg?width=700"],
["석굴암","석굴암은 경상북도 경주 토함산에 있는 신라 시대의 석굴 사원입니다. 인공적으로 만든 석굴 안에 본존불을 중심으로 여러 불상과 조각이 배치되어 있습니다. 석굴의 구조와 조각은 신라 시대 불교문화와 뛰어난 석조 기술을 보여주는 중요한 자료입니다. 불국사와 함께 유네스코 세계유산으로 등재되어 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Seokguram.jpg?width=700"],
["한라산","한라산은 제주도 한가운데에 솟아 있는 화산으로 대한민국에서 가장 높은 산입니다. 정상에는 백록담이라는 화구호가 있고, 산의 높이에 따라 기후와 식물의 모습이 달라집니다. 산에는 오름과 계곡, 다양한 식생이 나타나 제주도의 자연환경을 이해하는 데 중요한 장소입니다. 한라산을 포함한 제주 화산섬과 용암 동굴은 유네스코 세계자연유산으로 등재되어 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Hallasan.jpg?width=700"],
["성산일출봉","성산일출봉은 제주도 동쪽 바닷가에 있는 독특한 화산 지형으로, 바다에서 솟아오른 커다란 분화구의 모습을 볼 수 있습니다. 정상에 오르면 주변 바다와 제주도의 해안 풍경을 넓게 바라볼 수 있습니다. 특히 해가 떠오르는 모습을 보기 좋은 장소로 널리 알려져 있습니다. 성산일출봉은 제주 화산섬과 용암 동굴 세계자연유산의 일부입니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Seongsan_Ilchulbong.jpg?width=700"],
["순천만","순천만은 전라남도 순천에 있는 넓은 연안 습지로 갯벌과 갈대밭이 함께 발달한 곳입니다. 물이 빠지는 시간에는 넓은 갯벌이 드러나고, 여러 생물이 살아가는 모습을 관찰할 수 있습니다. 철새가 찾아오는 곳으로도 알려져 있어 습지와 생태환경을 살펴보기에 좋은 장소입니다. 주변의 갈대밭과 해안 풍경은 우리나라 남해안의 자연환경을 보여주는 대표적인 모습입니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Suncheon%20Bay.jpg?width=700"],
["설악산","설악산은 강원특별자치도에 있는 산으로 높은 봉우리와 기암괴석, 숲과 계곡이 어우러진 자연경관으로 유명합니다. 계절에 따라 신록·단풍·눈 덮인 산의 모습을 볼 수 있어 사계절의 변화가 뚜렷하게 나타납니다. 산림과 계곡에는 다양한 동식물이 살아가며, 여러 탐방로를 통해 자연을 관찰할 수 있습니다. 우리나라의 대표적인 산악 자연환경을 살펴볼 수 있는 장소입니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Seoraksan.jpg?width=700"],
["해운대","해운대는 부산광역시에 있는 대표적인 해안 관광지로 넓은 모래사장과 바다가 펼쳐져 있습니다. 여름철에는 많은 사람들이 바다와 해변을 찾으며, 주변에는 도시의 다양한 시설도 함께 발달해 있습니다. 해운대의 해안 풍경을 보면 부산이 바다와 가까운 도시라는 점을 알 수 있습니다. 주변의 동백섬과 마린시티 등과 함께 부산의 도시와 해안 환경을 살펴볼 수 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Haeundae%20Beach.jpg?width=700"],
["고창·화순·강화 고인돌 유적","고창·화순·강화 고인돌 유적은 선사시대 사람들이 만든 거대한 돌무덤인 고인돌이 여러 지역에 모여 있는 유적입니다. 큰 돌을 세우거나 받치고 그 위에 덮개돌을 올린 형태가 많아 당시 사람들이 돌을 다루고 공동으로 일을 했던 모습을 짐작하게 합니다. 세 지역의 고인돌은 형태와 분포가 다양해 한반도 청동기시대 문화를 살펴보는 중요한 자료입니다. 이 유적은 유네스코 세계유산으로 등재되어 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Dolmen%20in%20Korea.jpg?width=700"],
["수원 화성","수원 화성은 조선 정조 때인 18세기 말에 축조된 성곽입니다. 성벽을 따라 성문·포루·망루 등 여러 방어 시설이 배치되어 있어 당시의 성곽 건축 기술을 살펴볼 수 있습니다. 정조가 수원에 새로운 도시를 발전시키는 과정에서 중요한 역할을 한 장소이기도 합니다. 오늘날에는 성곽을 따라 걸으며 건축물과 도시의 모습을 함께 살펴볼 수 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Hwaseong%20Fortress.jpg?width=700"],
["하회마을","하회마을은 경상북도 안동에 있는 전통 마을로 낙동강이 마을을 돌아 흐르는 지형이 특징입니다. 전통 한옥과 오래된 마을길이 남아 있어 조선 시대 양반 마을의 모습을 살펴볼 수 있습니다. 탈놀이와 같은 전통문화와도 관계가 깊으며 마을의 자연환경과 건축이 함께 어우러져 있습니다. 역사적 경관을 잘 간직한 곳으로 유네스코 세계유산에 등재되어 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Hahoe%20Folk%20Village.jpg?width=700"],
["해인사 장경판전","해인사 장경판전은 경상남도 합천 해인사에 있는 전통 목조건축물로 팔만대장경 목판을 보관해 온 건물입니다. 건물의 창호와 통풍 구조는 목판을 오랫동안 보존할 수 있도록 만들어졌습니다. 장경판전과 팔만대장경은 우리나라의 인쇄문화와 전통 건축 기술을 함께 살펴볼 수 있는 중요한 문화유산입니다. 장경판전은 해인사 장경판전이라는 이름으로 유네스코 세계유산에 등재되어 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Haeinsa%20Janggyeong%20Panjeon.jpg?width=700"]
],
culture:[
["한복","한복은 한국의 전통 의복으로 저고리와 치마 또는 바지 등을 기본으로 구성합니다. 옷의 선이 부드럽고 움직이기 편하도록 만들어졌으며 색과 장식도 다양합니다. 예전에는 일상생활에서 널리 입었지만 오늘날에는 명절이나 결혼식, 전통 행사 등 특별한 날에 입는 경우가 많습니다. 시대에 맞게 디자인을 바꾼 생활한복도 있어 전통과 현대의 모습을 함께 살펴볼 수 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Hanbok%20%ED%95%9C%EB%B3%B5%20%284261102177%29.jpg?width=700"],
["설날","설날은 음력 1월 1일을 중심으로 새해를 맞는 우리나라의 대표적인 명절입니다. 가족이 모여 어른께 인사를 드리고 떡국을 먹으며 한 해의 건강과 좋은 일을 기원하는 풍습이 있습니다. 세배와 윷놀이처럼 설날에 함께하는 전통 활동도 있습니다. 오늘날에는 가족이 함께 시간을 보내며 새해를 맞는 날로 이어지고 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Seollal.jpg?width=700"],
["추석","추석은 음력 8월 15일에 맞는 우리나라의 대표적인 명절입니다. 가족과 친지가 모여 차례를 지내거나 성묘를 하며 조상과 가족의 의미를 생각하는 날로 전해져 왔습니다. 송편과 같은 명절 음식을 만들어 나누어 먹기도 합니다. 계절의 변화와 수확의 기쁨을 함께 나누는 명절이라는 점에서도 의미가 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Chuseok.jpg?width=700"],
["윷놀이","윷놀이는 네 개의 윷가락을 던져 나온 결과에 따라 말을 움직이는 우리나라의 전통 놀이입니다. 여러 사람이 편을 나누어 즐길 수 있고, 윷의 결과에 따라 말의 이동 방법이 달라집니다. 가족이나 친구가 함께 규칙을 정하고 놀이를 하면서 자연스럽게 차례와 전략을 익힐 수 있습니다. 설날을 비롯한 명절이나 가족 모임에서 즐겨 온 놀이입니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Yut.jpg?width=700"],
["판소리","판소리는 한 명의 소리꾼이 고수의 장단에 맞추어 긴 이야기를 노래와 말, 몸짓으로 표현하는 전통 공연예술입니다. 소리꾼은 노래와 이야기를 오가며 등장인물과 사건을 표현하고, 고수는 북을 치며 장단을 맞춥니다. 오랜 시간 이어진 이야기와 음악을 함께 감상할 수 있어 한국 전통예술의 특징을 잘 보여줍니다. 판소리는 유네스코 인류무형문화유산으로 등재되어 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Pansori.jpg?width=700"],
["강강술래","강강술래는 여러 사람이 손을 잡고 원을 이루어 노래와 춤을 추는 전통 민속예술입니다. 참가자들이 함께 움직이며 노래를 이어 가기 때문에 여럿이 협력하는 모습이 잘 드러납니다. 주로 남해안 지역을 중심으로 전해져 왔으며 명절이나 전통 행사와도 관계가 깊습니다. 강강술래는 유네스코 인류무형문화유산으로 등재되어 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Ganggangsullae%20jindo.jpg?width=700"],
["한옥","한옥은 나무·흙·돌 등을 활용하여 지은 한국의 전통 주거 형태입니다. 방을 따뜻하게 하는 온돌과 집 안에서 다양한 활동을 할 수 있는 마당이 중요한 특징으로 꼽힙니다. 지역의 기후와 지형에 따라 집의 구조와 재료가 달라지기도 합니다. 오늘날에는 전통 한옥을 보존하면서 현대 생활에 맞게 고친 집도 볼 수 있습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Bukchon%20Hanok%20Village.jpg?width=700"],
["K-pop","K-pop은 한국에서 만들어진 대중음악을 가리키는 말로, 노래뿐 아니라 춤과 공연, 영상 등 여러 요소가 함께 발전해 왔습니다. 아이돌 그룹을 비롯한 다양한 가수와 음악가가 활동하며 여러 장르의 음악을 활용합니다. 음악 방송과 공연, 온라인 영상 등을 통해 많은 사람들이 K-pop을 접하고 있습니다. 한국의 현대 대중문화를 이해할 때 살펴볼 수 있는 중요한 문화 현상 가운데 하나입니다.","https://commons.wikimedia.org/wiki/Special:FilePath/K-pop%20concert.jpg?width=700"],
["한국 영화와 드라마","한국의 영화와 드라마는 가족 이야기, 역사 이야기, 일상생활, 모험과 추리 등 다양한 주제를 다룹니다. 제작 기술과 배우들의 연기, 촬영과 음악 등 여러 요소가 함께 어우러져 하나의 이야기를 만듭니다. 국내에서 많은 시청자와 관객이 즐기는 문화 콘텐츠이며 해외에서도 한국의 현대 문화를 접하는 방법 가운데 하나가 되고 있습니다. 작품마다 이야기와 표현 방식이 다르므로 여러 작품을 비교해 보는 것도 흥미롭습니다.","https://commons.wikimedia.org/wiki/Special:FilePath/Korean%20film%20set.jpg?width=700"]
]
};;
const OTHER_DATA={"JP":{"food":[["초밥","식초로 간을 한 밥에 생선·해산물·채소 등을 올리거나 말아 만든 일본 음식입니다. 재료의 신선함과 밥의 맛을 중요하게 생각하며 여러 형태가 있습니다.",""],["라멘","면을 국물에 넣어 먹는 일본의 대표적인 면 요리입니다. 국물과 면, 고명에 따라 다양한 지역식이 있습니다.",""],["오니기리","밥을 삼각형이나 둥근 모양으로 뭉쳐 속재료를 넣고 김으로 감싸기도 하는 음식입니다.",""],["텐동","튀김을 밥 위에 올리고 소스 등을 곁들여 먹는 일본식 덮밥입니다.",""],["우동","굵고 부드러운 밀가루 면을 따뜻하거나 차가운 국물과 함께 먹는 음식입니다.",""],["말차","찻잎을 곱게 갈아 물에 풀어 마시는 일본의 녹차 문화와 관련된 차입니다.",""]],"animals":[["일본원숭이","일본의 산림 지역에 사는 원숭이로 추운 지역에서도 생활하는 것으로 알려져 있습니다.",""],["일본사슴","나라 등 여러 지역에서 볼 수 있는 사슴으로 일본의 자연과 문화에서 친숙한 동물입니다.",""],["두루미","홋카이도 등지에서 관찰되는 큰 새로 습지와 초원 생태계와 관계가 있습니다.",""],["벚나무","봄에 꽃을 피우는 나무로 일본의 봄 풍경과 문화에서 널리 알려져 있습니다.",""],["삼나무","일본의 산림에 많이 심어진 상록수로 목재 생산과 산림 경관에 중요한 나무입니다.",""],["잉어","연못과 강 등에서 기르는 관상어로 일본의 정원문화에서도 자주 볼 수 있습니다.",""]],"places":[["도쿄","일본의 수도로 정치·경제·문화의 중심지입니다. 현대적인 도시 경관과 전통적인 신사·정원이 함께 있습니다.",""],["교토","오랜 기간 일본의 수도였던 도시로 사찰과 정원, 전통문화가 잘 남아 있습니다.",""],["후지산","일본에서 가장 높은 산으로 화산 지형과 아름다운 경관으로 잘 알려져 있습니다.",""],["히메지성","흰 벽이 특징인 일본의 대표적인 성으로 일본 성곽 건축을 보여줍니다.",""],["나라공원","사슴과 역사적 사찰을 함께 볼 수 있는 공원으로 일본의 고도 문화를 살펴볼 수 있습니다.",""],["히로시마 평화기념공원","원폭 피해의 역사를 기억하고 평화를 생각하기 위한 공간입니다.",""]],"culture":[["기모노","일본의 전통 의복으로 계절과 행사에 따라 다양한 무늬와 색을 사용합니다.",""],["다도","차를 준비하고 손님에게 대접하는 과정을 중요하게 여기는 일본의 전통문화입니다.",""],["서예","붓과 먹으로 글씨를 아름답게 표현하는 예술로 일본에서도 오래 이어졌습니다.",""],["마쓰리","지역의 신사나 공동체를 중심으로 열리는 일본의 전통 축제입니다.",""],["가부키","화려한 의상과 음악, 연기를 사용하는 일본의 전통 연극입니다.",""],["애니메이션","그림과 영상 기술을 이용해 이야기를 표현하는 일본의 대중문화로 세계 여러 나라에서 감상합니다.",""]]},"CN":{"food":[["베이징 오리구이","오리를 구워 얇게 썬 뒤 밀전병과 채소, 소스를 곁들여 먹는 베이징의 대표 음식입니다.",""],["만두","밀가루 반죽에 고기나 채소 등을 넣어 빚고 찌거나 삶거나 굽는 음식입니다.",""],["볶음밥","밥과 채소, 달걀, 고기 등을 센 불에 볶아 만드는 음식으로 여러 지역에서 다양한 방식으로 먹습니다.",""],["마파두부","두부와 다진 고기, 매운 양념 등을 함께 조리하는 쓰촨 지역 음식입니다.",""],["딤섬","작은 만두와 찐 음식 등을 차와 함께 즐기는 중국 남부의 음식 문화입니다.",""],["훠궈","끓는 육수에 고기와 채소 등을 넣어 익혀 먹는 중국식 전골 요리입니다.",""]],"animals":[["판다","중국을 대표하는 동물로 대나무를 주로 먹으며 중국 중서부 산악지대의 숲에서 생활합니다.",""],["금빛원숭이","중국 산악지역의 숲에 사는 원숭이로 황금빛 털이 특징입니다.",""],["양쯔강돌고래","양쯔강에 살던 민물돌고래로 중국의 강 생태계와 환경보전의 중요성을 보여주는 동물입니다.",""],["대나무","판다의 주요 먹이이며 중국 남부와 중부의 따뜻하고 습한 지역에서 잘 자랍니다.",""],["은행나무","중국에서 오래전부터 재배되어 온 나무로 가로수와 정원수로도 널리 이용됩니다.",""],["차나무","중국의 여러 지역에서 재배되며 녹차·홍차 등 차의 원료가 됩니다.",""]],"places":[["만리장성","중국 북부에 여러 시대에 걸쳐 만들어진 성벽과 방어시설로 이어진 거대한 역사 유적입니다.",""],["자금성","베이징 중심부에 있는 옛 황궁으로 중국 황실의 역사와 궁궐 건축을 살펴볼 수 있습니다.",""],["상하이","중국 동부의 큰 도시로 황푸강과 항구, 현대적인 도시 경관이 발달했습니다.",""],["시안 병마용","진시황릉 주변에서 발견된 대규모 토용으로 진나라의 역사와 장례문화를 보여줍니다.",""],["장가계","기둥 모양의 바위 봉우리와 계곡이 발달한 중국의 대표적인 자연경관 지역입니다.",""],["리장 고성","중국 남서부의 전통 도시 경관과 수로, 건축이 남아 있는 역사적인 지역입니다.",""]],"culture":[["한자","중국에서 발전한 문자로 동아시아 여러 지역의 문자와 언어에도 큰 영향을 주었습니다.",""],["중추절","음력 8월 15일에 달을 바라보고 가족이 모이는 대표적인 명절입니다.",""],["춘절","음력 새해를 맞는 중국의 큰 명절로 가족이 모이고 다양한 전통 행사가 열립니다.",""],["경극","노래·대사·연기·무술과 화려한 의상을 결합한 중국의 전통 공연예술입니다.",""],["서예","붓으로 한자를 쓰며 글씨의 모양과 필법을 중요하게 여기는 전통 예술입니다.",""],["차 문화","차를 우려 마시고 손님을 대접하는 오랜 생활문화로 중국 여러 지역에서 다양한 차가 발달했습니다.",""]]},"US":{"food":[["햄버거","빵 사이에 고기 패티와 채소, 소스 등을 넣어 먹는 대표적인 미국식 대중 음식입니다.",""],["애플파이","사과를 달콤하게 조리해 파이 반죽에 넣어 구운 디저트로 미국의 대표적인 가정식 이미지와 연결됩니다.",""],["바비큐","고기 등을 불이나 훈연으로 천천히 익히는 조리 방식으로 지역마다 소스와 고기 종류가 다릅니다.",""],["팬케이크","밀가루 반죽을 둥글게 구워 시럽이나 과일 등을 곁들여 먹는 아침 식사입니다.",""],["클램차우더","조개와 감자 등을 넣어 만든 걸쭉한 수프로 미국 동북부 지역 음식으로 유명합니다.",""],["검보","육수에 고기나 해산물, 채소 등을 넣어 끓이는 미국 남부 루이지애나의 음식입니다.",""]],"animals":[["흰머리수리","미국의 국가 상징에 사용되는 큰 맹금류로 강과 호수, 해안 주변에서 생활합니다.",""],["들소","북아메리카 초원에 살던 대형 초식동물로 미국 서부와 평원의 자연을 상징하는 동물입니다.",""],["미국악어","미국 남동부의 습지와 강에 사는 큰 파충류입니다.",""],["레드우드","미국 캘리포니아 해안지역에 자라는 매우 큰 나무로 오래된 숲을 이룹니다.",""],["단풍나무","미국 북동부와 캐나다 지역에서 많이 볼 수 있으며 가을 단풍이 유명합니다.",""],["선인장","미국 남서부의 건조한 지역에 적응한 식물로 물을 저장하는 특징이 있습니다.",""]],"places":[["워싱턴 D.C.","미국의 수도로 백악관과 의회 의사당, 여러 국가기념시설이 모여 있습니다.",""],["뉴욕","대서양 연안의 대도시로 금융·문화·언론·예술 분야에서 국제적인 영향력이 큰 도시입니다.",""],["그랜드캐니언","콜로라도강이 오랜 시간 암석을 깎아 만든 거대한 협곡으로 미국의 대표적인 자연경관입니다.",""],["옐로스톤","간헐천과 온천, 야생동물이 있는 넓은 국립공원으로 세계 최초의 국립공원으로 알려져 있습니다.",""],["자유의 여신상","뉴욕 항구에 세워진 대형 동상으로 자유와 미국 이민 역사를 상징하는 장소로 널리 알려져 있습니다.",""],["하와이 화산국립공원","하와이섬의 화산과 용암 지형을 관찰할 수 있는 국립공원입니다.",""]],"culture":[["할리우드 영화","미국 영화산업을 대표하는 문화 영역으로 다양한 장르의 영화가 제작되고 세계 여러 나라에 소개됩니다.",""],["재즈","미국에서 발전한 음악 장르로 즉흥연주와 다양한 리듬을 특징으로 합니다.",""],["블루스","미국 남부의 아프리카계 미국인 음악 전통에서 발전한 음악으로 이후 여러 대중음악에 영향을 주었습니다.",""],["야구","미국에서 오랫동안 사랑받아 온 대표적인 구기 종목으로 프로리그와 지역 스포츠 문화가 발달했습니다.",""],["추수감사절","가족이 모여 식사를 하고 감사의 의미를 생각하는 미국의 대표적인 명절입니다.",""],["독립기념일","7월 4일에 미국의 독립을 기념하는 국가적 기념일입니다.",""]]},"FR":{"food":[["바게트","길고 바삭한 껍질과 부드러운 속을 가진 프랑스의 대표적인 빵입니다.",""],["크루아상","버터를 넣은 반죽을 여러 겹으로 접어 구워 만든 초승달 모양의 빵입니다.",""],["라따뚜이","토마토, 가지, 호박 등 채소를 익혀 만드는 프랑스 남부의 대표적인 요리입니다.",""],["에스카르고","달팽이를 조리해 버터와 마늘 등의 양념과 함께 먹는 프랑스 음식입니다.",""],["치즈","우유를 발효·응고시켜 만든 식품으로 프랑스에는 지역마다 다양한 치즈가 있습니다.",""],["크렘 브륄레","부드러운 크림 위에 설탕을 올려 표면을 바삭하게 캐러멜화한 디저트입니다.",""]],"animals":[["갈리아수탉","프랑스의 상징 가운데 하나로 문화와 스포츠에서 프랑스를 나타내는 이미지로 사용됩니다.",""],["알프스아이벡스","프랑스 알프스 산악지역에서 볼 수 있는 산양류로 바위가 많은 높은 산에 적응했습니다.",""],["붉은여우","프랑스의 숲과 농촌 등 다양한 환경에서 살아가는 포유류입니다.",""],["라벤더","프랑스 남부 프로방스 지역의 풍경과 향료·관광문화에서 잘 알려진 식물입니다.",""],["포도나무","프랑스 여러 지역에서 재배되며 포도와 포도주 문화의 중요한 기반입니다.",""],["해바라기","프랑스 농촌에서 여름철 노란 꽃밭을 이루는 모습을 볼 수 있는 대표적인 작물입니다.",""]],"places":[["파리 에펠탑","파리의 대표적인 철제 구조물로 프랑스를 상징하는 건축물 가운데 하나입니다.",""],["루브르 박물관","세계적으로 유명한 미술관으로 다양한 시대와 지역의 예술 작품을 소장하고 있습니다.",""],["베르사유 궁전","프랑스 왕실의 역사와 궁정문화를 보여주는 대규모 궁전과 정원이 있는 곳입니다.",""],["몽생미셸","바다와 갯벌 사이의 섬에 세워진 수도원과 마을로 독특한 경관을 보여줍니다.",""],["니스","지중해 연안의 도시로 온화한 기후와 해안 경관으로 유명합니다.",""],["알프스 몽블랑","프랑스와 이탈리아 국경 부근 알프스에 있는 유럽의 대표적인 높은 산입니다.",""]],"culture":[["프랑스 요리","지역의 재료와 조리법을 중요하게 생각하는 식문화로 다양한 빵·치즈·요리가 발달했습니다.",""],["패션","파리를 중심으로 오랫동안 발전한 산업과 문화로 의상 디자인과 브랜드 문화가 유명합니다.",""],["미술","인상주의를 비롯해 여러 미술사조가 발전한 나라로 많은 미술관과 작품을 만날 수 있습니다.",""],["카페 문화","카페에서 음료와 간단한 음식을 즐기며 사람들과 대화하는 도시 생활문화가 발달했습니다.",""],["바스티유 데이","7월 14일 프랑스혁명을 기념하는 국가 기념일로 여러 지역에서 행사가 열립니다.",""],["프랑스 영화","영화의 초기 발전부터 이어진 전통이 있으며 다양한 예술영화와 대중영화가 제작됩니다.",""]]},"EG":{"food":[["코샤리","쌀·렌틸콩·파스타·병아리콩 등을 함께 담고 토마토소스와 양파 등을 곁들이는 이집트의 대표 음식입니다.",""],["팔라펠","콩이나 병아리콩 등을 갈아 향신료와 섞어 튀겨 먹는 음식으로 이집트에서는 타미야라고도 부릅니다.",""],["풀 메담메스","잠두콩을 오래 익혀 올리브유와 향신료 등을 곁들여 먹는 전통 음식입니다.",""],["몰로키야","몰로키야 잎을 잘게 다져 육수와 함께 끓여 먹는 이집트 음식입니다.",""],["피타빵","납작한 빵으로 여러 음식과 함께 먹으며 중동과 지중해 지역 식문화와 관련이 있습니다.",""],["바클라바","얇은 반죽 사이에 견과류와 시럽을 넣어 만든 달콤한 디저트입니다.",""]],"animals":[["이집트코브라","이집트 등 북아프리카에 사는 독사로 주로 건조한 지역과 농경지 주변에서 관찰됩니다.",""],["나일악어","나일강과 아프리카의 여러 민물 환경에 사는 큰 파충류입니다.",""],["사막여우","작은 몸과 큰 귀가 특징인 여우로 북아프리카 사막의 건조한 환경에 적응했습니다.",""],["대추야자","건조한 지역에서 잘 자라며 이집트의 농업과 식생활에서 중요한 나무입니다.",""],["파피루스","나일강 주변 습지에서 자라던 식물로 고대 이집트에서 기록 재료로 이용되었습니다.",""],["연꽃","고대 이집트의 미술과 상징에서 자주 나타나는 수생식물입니다.",""]],"places":[["기자의 피라미드","고대 이집트 왕들의 무덤으로 만들어진 거대한 피라미드군으로 세계적으로 유명한 유적입니다.",""],["스핑크스","사람의 머리와 사자의 몸을 가진 거대한 석상으로 기자 피라미드 주변에 있습니다.",""],["룩소르 신전","고대 이집트의 신전 유적이 남아 있는 룩소르의 대표적인 역사 장소입니다.",""],["왕가의 계곡","고대 이집트 신왕국 시대의 왕릉들이 있는 계곡으로 많은 무덤이 발견되었습니다.",""],["아부심벨","거대한 암벽 신전으로 람세스 2세와 관련된 고대 이집트 유적입니다.",""],["나일강","이집트의 농업과 도시생활에 매우 중요한 강으로 오랜 문명의 발전을 가능하게 했습니다.",""]],"culture":[["고대 이집트 문자","상형문자를 비롯한 고대 이집트의 문자 체계는 신전과 무덤, 기록물에 사용되었습니다.",""],["이집트 전통음악","아랍 음악과 북아프리카 지역의 음악 전통이 어우러진 다양한 음악문화가 있습니다.",""],["라마단","이슬람교의 중요한 달로 해가 떠 있는 동안 금식하는 등 다양한 종교적 실천이 이루어집니다.",""],["이집트 박물관 문화","고대 이집트 유물과 미라, 조각 등을 보존하고 전시하는 박물관들이 발달했습니다.",""],["시장 문화","전통시장과 상점에서 향신료·식품·공예품 등을 사고파는 생활문화가 이어지고 있습니다.",""],["아랍어 서예","아랍 문자를 아름답게 표현하는 서예가 종교와 예술문화에서 중요한 전통으로 이어집니다.",""]]}};
const TEXT={"KR":{"basic":"<h2>1. 기본정보</h2>\n<div class=\"info-grid\">\n<div class=\"info\"><b>나라 이름</b>대한민국 (Republic of Korea)</div>\n<div class=\"info\"><b>위치</b>동아시아 · 한반도 남쪽</div>\n<div class=\"info\"><b>수도</b>서울특별시</div>\n<div class=\"info\"><b>면적</b>약 100,459㎢ (2025년 기준)</div>\n<div class=\"info\"><b>인구</b>약 5,168만 명 (2025년 추계)</div>\n<div class=\"info\"><b>언어</b>한국어</div>\n<div class=\"info\"><b>문자</b>한글</div>\n<div class=\"info\"><b>화폐</b>대한민국 원 (₩)</div>\n<div class=\"info\"><b>국가</b>애국가</div>\n</div>\n<p>대한민국은 동아시아의 한반도 남쪽에 자리한 나라입니다. 동쪽·남쪽·서쪽은 바다와 맞닿아 있고 북쪽으로는 북한과 접합니다. 국토에는 산지가 많으며, 서쪽과 남쪽에는 평야와 넓은 해안이 발달해 있습니다.</p>\n<p>대한민국의 면적은 약 100,459㎢이며, 인구는 국가통계의 기준에 따라 달라집니다. KOSIS는 2025년 추계인구를 51,684,564명으로 제시하고 있습니다.</p>\n<p class=\"note\">※ 인구는 2025년 추계인구를 사용했고, 면적은 대한민국 정부가 안내하는 2025년 기준 약 100,459㎢를 사용했습니다.</p>","capital":"<h2>4. 수도 설명</h2>\n<h3>서울특별시</h3>\n<p>서울은 대한민국의 수도이며 정치·경제·문화·교육의 중심지 가운데 하나입니다. 한강이 도시를 가로지르고 있으며, 북쪽에는 북한산을 비롯한 산지가 있습니다.</p>\n<p>서울에는 조선 시대의 궁궐과 성곽, 종묘 같은 역사 유산과 현대적인 고층 건물, 지하철과 같은 도시 기반시설이 함께 있습니다. 경복궁·창덕궁·남산·한강 등은 서울의 역사와 현재 모습을 살펴볼 수 있는 대표적인 장소입니다.</p>\n<p>서울은 조선이 한양을 수도로 정한 뒤 오랜 기간 우리나라의 중심 도시 역할을 해 왔습니다.</p>","nature":"<h2>5. 자연과 기후</h2>\n<h3>산과 강</h3>\n<p>대한민국은 산지가 많은 나라입니다. 태백산맥과 소백산맥 등 여러 산지가 이어지며, 높은 산과 낮은 구릉이 함께 나타납니다. 한강·낙동강·금강·영산강 등 큰 강은 여러 지역의 생활과 농업에 중요한 역할을 합니다.</p>\n<h3>바다와 섬</h3>\n<p>대한민국은 동해·서해·남해에 둘러싸여 있습니다. 서해와 남해에는 섬이 많고 갯벌도 발달했습니다. 해안의 모습은 지역에 따라 모래사장, 갯벌, 암석 해안 등 다양합니다.</p>\n<h3>기후</h3>\n<p>사계절의 변화가 비교적 뚜렷합니다. 봄과 가을은 비교적 온화하고, 여름에는 덥고 습하며 비가 집중되는 시기가 있습니다. 겨울에는 차고 건조한 날씨가 나타납니다. 남쪽으로 갈수록 겨울이 비교적 온화하고, 산에서는 높이에 따라 기온 차이가 커집니다.</p>\n<h3>제주의 자연</h3>\n<p>제주도는 화산 활동으로 만들어진 섬입니다. 한라산과 오름, 용암 동굴 등 독특한 화산 지형이 발달했으며, 제주 화산섬과 용암 동굴은 유네스코 세계자연유산으로 등재되어 있습니다.</p>","language":"<h2>6. 언어와 문자</h2>\n<p>대한민국에서 주로 사용하는 언어는 <strong>한국어</strong>이고, 한국어를 적는 데 널리 사용하는 문자는 <strong>한글</strong>입니다.</p>\n<div class=\"lang-grid\">\n<div class=\"lang\"><div class=\"kr\">뜻: 안녕하세요</div><div class=\"native\">안녕하세요</div><div class=\"sound\">한글말음: 안녕하세요<br>로마자: annyeonghaseyo</div></div>\n<div class=\"lang\"><div class=\"kr\">뜻: 고맙습니다</div><div class=\"native\">고맙습니다</div><div class=\"sound\">한글말음: 고맙습니다<br>로마자: gomapseumnida</div></div>\n</div>\n<p>한글은 자음과 모음을 조합하여 글자를 만드는 체계를 가지고 있습니다. 세종대왕이 중심이 되어 만들어졌으며, 1443년에 창제되고 1446년에 『훈민정음』이라는 이름으로 반포되었습니다.</p>\n<p>한글은 소리의 구조를 비교적 체계적으로 나타낼 수 있어, 우리말의 발음을 글자로 표현하기에 편리한 문자입니다.</p>","history":"<h2>11. 한눈에 보는 대한민국 역사</h2>\n<div class=\"history\">\n<div class=\"event\"><b>기원전 2333년경</b><br>고조선이 세워졌다고 전해집니다.</div>\n<div class=\"event\"><b>기원전 1세기 무렵</b><br>한반도와 주변 지역에서 여러 고대 국가가 발전했습니다.</div>\n<div class=\"event\"><b>668년</b><br>신라가 한반도 중남부를 중심으로 통일 신라 시대를 열었습니다.</div>\n<div class=\"event\"><b>918년</b><br>왕건이 고려를 세웠습니다.</div>\n<div class=\"event\"><b>1392년</b><br>이성계가 조선을 세웠습니다.</div>\n<div class=\"event\"><b>1395년</b><br>조선의 법궁인 경복궁이 처음 지어졌습니다.</div>\n<div class=\"event\"><b>1446년</b><br>훈민정음이 반포되었습니다.</div>\n<div class=\"event\"><b>1592년</b><br>임진왜란이 시작되었습니다.</div>\n<div class=\"event\"><b>1910년</b><br>대한제국이 일본에 병합되었습니다.</div>\n<div class=\"event\"><b>1919년</b><br>3·1운동이 일어났고 대한민국 임시정부가 수립되었습니다.</div>\n<div class=\"event\"><b>1945년</b><br>광복을 맞았습니다.</div>\n<div class=\"event\"><b>1948년</b><br>대한민국 정부가 수립되었습니다.</div>\n<div class=\"event\"><b>1950년</b><br>한국전쟁이 시작되었습니다.</div>\n<div class=\"event\"><b>1953년</b><br>한국전쟁의 정전협정이 체결되었습니다.</div>\n<div class=\"event\"><b>1988년</b><br>서울에서 하계 올림픽이 열렸습니다.</div>\n<div class=\"event\"><b>2002년</b><br>한일 월드컵이 대한민국과 일본에서 공동 개최되었습니다.</div>\n</div>","sources":"<h2>12. 자료를 확인한 곳</h2>\n<ul class=\"sources\">\n<li>대한민국 정부 공식 공개자료 및 Korea.net</li>\n<li>국가통계처(KOSIS) 공개 통계</li>\n<li>국가유산 관련 공식 자료</li>\n<li>유네스코 세계유산·무형유산 공개자료</li>\n<li>Wikimedia Commons 지도·국기 자료</li>\n</ul>\n<p class=\"note\">인구는 KOSIS 2025년 추계인구를 사용했습니다. 대한민국 면적은 Korea.net의 2025년 안내값을 사용했습니다.</p>"},"JP":{"capital":"<h3>도쿄</h3><p>도쿄는 일본의 수도이며 정치·경제·문화의 중심지입니다. 현대적인 고층 건물과 오래된 신사·사원이 함께 있어 일본의 전통과 현대를 한 도시에서 살펴볼 수 있습니다.</p><p>도쿄에는 일본 국회의사당, 황궁, 아사쿠사와 같은 역사·문화 공간과 대규모 상업지역이 함께 발달해 있습니다.</p>","nature":"<h3>산과 섬</h3><p>일본은 태평양 가장자리에 길게 이어진 섬나라로 홋카이도·혼슈·시코쿠·규슈를 비롯한 많은 섬으로 이루어져 있습니다. 화산과 산지가 많고 지진 활동도 활발합니다.</p><h3>기후</h3><p>북쪽의 홋카이도부터 남쪽의 오키나와까지 남북으로 길게 뻗어 있어 지역에 따라 기후가 크게 다릅니다. 장마와 태풍의 영향을 받는 지역도 있습니다.</p>","language":"<h3>언어와 문자</h3><p>일본어가 주로 사용되며 히라가나·가타카나와 한자를 함께 사용합니다. 지역에 따라 방언도 있습니다.</p>","history":"<h3>한눈에 보는 일본 역사</h3><div class=\"history-grid\"><div class=\"history-item\"><b>8세기</b><span>나라 시대에 수도와 국가 제도가 정비되었습니다.</span></div><div class=\"history-item\"><b>794년</b><span>헤이안 시대가 시작되고 교토가 오랫동안 수도 역할을 했습니다.</span></div><div class=\"history-item\"><b>1603년</b><span>도쿠가와 이에야스가 에도 막부를 세웠습니다.</span></div><div class=\"history-item\"><b>1868년</b><span>메이지유신으로 근대 국가로의 큰 변화가 시작되었습니다.</span></div><div class=\"history-item\"><b>1945년</b><span>제2차 세계대전이 끝나고 전후 재건이 시작되었습니다.</span></div><div class=\"history-item\"><b>1964년</b><span>도쿄 올림픽이 열리며 전후 일본의 발전을 세계에 보여주었습니다.</span></div></div>","sources":"<p>자료 확인: 일본 정부·관광청 자료, 통계자료, Wikimedia Commons 지도·이미지 자료 등을 참고했습니다.</p>"},"CN":{"capital":"<h3>베이징</h3><p>베이징은 중국의 수도로 정치와 국가 행정의 중심지입니다. 자금성과 천안문 등 중국의 역사와 현대 국가의 모습을 함께 볼 수 있습니다.</p>","nature":"<h3>넓은 국토</h3><p>중국은 매우 넓은 국토를 가지고 있어 동쪽의 평야와 해안에서 서쪽의 높은 산맥과 고원까지 자연환경이 다양합니다.</p><h3>기후</h3><p>지역에 따라 한랭한 북부, 건조한 내륙, 따뜻하고 습한 남부 등 기후 차이가 큽니다. 계절풍의 영향도 크게 받습니다.</p>","language":"<h3>언어와 문자</h3><p>표준 중국어인 보통화가 널리 사용되며 한자를 사용합니다. 지역에 따라 서로 다른 방언과 언어가 사용됩니다.</p>","history":"<h3>한눈에 보는 중국 역사</h3><div class=\"history-grid\"><div class=\"history-item\"><b>기원전 3세기</b><span>진이 중국을 통일하고 중앙집권적 국가의 기초를 마련했습니다.</span></div><div class=\"history-item\"><b>한나라</b><span>중앙아시아와의 교류가 확대되고 실크로드가 발전했습니다.</span></div><div class=\"history-item\"><b>당나라</b><span>동아시아 국제 교류가 활발했던 시기입니다.</span></div><div class=\"history-item\"><b>1271년</b><span>원나라가 세워지고 몽골 제국과 연결된 광범위한 교류가 이루어졌습니다.</span></div><div class=\"history-item\"><b>1368년</b><span>명나라가 세워졌습니다.</span></div><div class=\"history-item\"><b>1949년</b><span>중화인민공화국이 수립되었습니다.</span></div></div>","sources":"<p>자료 확인: 중국 정부·통계자료, 국제통계, Wikimedia Commons 지도·이미지 자료 등을 참고했습니다.</p>"},"US":{"capital":"<h3>워싱턴 D.C.</h3><p>워싱턴 D.C.는 미국의 수도이며 대통령 관저인 백악관과 연방 의회 의사당, 여러 국가기관이 모여 있습니다.</p><p>도시의 주요 기념시설과 박물관을 통해 미국의 역사와 정치문화를 살펴볼 수 있습니다.</p>","nature":"<h3>넓고 다양한 자연</h3><p>미국은 대서양에서 태평양까지 매우 넓은 국토를 가지고 있어 산맥, 평원, 사막, 습지와 긴 해안 등 다양한 자연환경이 나타납니다.</p><h3>기후</h3><p>알래스카의 한대 기후부터 남부의 따뜻한 기후까지 지역별 차이가 큽니다. 태평양과 대서양의 영향도 받습니다.</p>","language":"<h3>언어와 문자</h3><p>영어가 가장 널리 사용되며 스페인어 등 다양한 언어도 사용됩니다. 미국은 여러 지역과 이민 배경을 가진 사람들이 함께 살아 언어와 문화가 다양합니다.</p>","history":"<h3>한눈에 보는 미국 역사</h3><div class=\"history-grid\"><div class=\"history-item\"><b>1776년</b><span>독립선언이 발표되었습니다.</span></div><div class=\"history-item\"><b>1787년</b><span>미국 헌법이 제정되었습니다.</span></div><div class=\"history-item\"><b>1861~1865년</b><span>남북전쟁이 벌어졌습니다.</span></div><div class=\"history-item\"><b>1869년</b><span>대륙횡단철도가 완성되어 동서 교통이 크게 연결되었습니다.</span></div><div class=\"history-item\"><b>1945년</b><span>제2차 세계대전 이후 국제사회에서 미국의 역할이 커졌습니다.</span></div><div class=\"history-item\"><b>1969년</b><span>아폴로 11호가 달에 착륙했습니다.</span></div></div>","sources":"<p>자료 확인: 미국 정부·Census Bureau, 국제통계, Wikimedia Commons 지도·이미지 자료 등을 참고했습니다.</p>"},"FR":{"capital":"<h3>파리</h3><p>파리는 프랑스의 수도로 정치·문화·예술·패션의 중심지 가운데 하나입니다. 센강을 따라 역사적인 건축물과 박물관이 많이 자리하고 있습니다.</p>","nature":"<h3>산과 평야, 해안</h3><p>프랑스 본토에는 알프스와 피레네산맥 같은 산지가 있고 넓은 평야와 강, 대서양·지중해의 해안이 함께 나타납니다.</p><h3>기후</h3><p>서쪽은 대서양의 영향을 받아 비교적 온화하고 습하며, 남부 지중해 연안은 따뜻하고 건조한 여름이 나타납니다.</p>","language":"<h3>언어와 문자</h3><p>프랑스어가 공용어이며 라틴 문자를 사용합니다. 지역에 따라 역사적으로 사용되어 온 여러 지역 언어도 있습니다.</p>","history":"<h3>한눈에 보는 프랑스 역사</h3><div class=\"history-grid\"><div class=\"history-item\"><b>기원전 1세기</b><span>로마의 지배가 갈리아 지역에 확대되었습니다.</span></div><div class=\"history-item\"><b>843년</b><span>베르됭 조약 이후 서프랑크 지역이 오늘날 프랑스의 역사적 기반 가운데 하나가 되었습니다.</span></div><div class=\"history-item\"><b>1789년</b><span>프랑스혁명이 시작되었습니다.</span></div><div class=\"history-item\"><b>1804년</b><span>나폴레옹이 황제가 되었습니다.</span></div><div class=\"history-item\"><b>1870년</b><span>제3공화국이 시작되었습니다.</span></div><div class=\"history-item\"><b>1958년</b><span>제5공화국이 출범했습니다.</span></div></div>","sources":"<p>자료 확인: 프랑스 정부·INSEE, 국제통계, Wikimedia Commons 지도·이미지 자료 등을 참고했습니다.</p>"},"EG":{"capital":"<h3>카이로</h3><p>카이로는 이집트의 수도이자 나일강 유역의 큰 도시입니다. 고대 유적과 현대적인 도시가 함께 있어 이집트의 역사를 살펴보기 좋은 곳입니다.</p>","nature":"<h3>나일강과 사막</h3><p>이집트는 국토 대부분이 사막이며 나일강 주변에 사람들이 많이 모여 살아갑니다. 나일강은 농업과 생활에 매우 중요한 물길입니다.</p><h3>기후</h3><p>대체로 건조하고 비가 적으며, 지중해 연안과 나일강 삼각주에서는 사막보다 비교적 온화한 환경을 볼 수 있습니다.</p>","language":"<h3>언어와 문자</h3><p>아랍어가 공용어이며 아랍 문자를 사용합니다. 관광과 국제 교류 분야에서는 영어와 프랑스어도 접할 수 있습니다.</p>","history":"<h3>한눈에 보는 이집트 역사</h3><div class=\"history-grid\"><div class=\"history-item\"><b>기원전 3100년경</b><span>상·하 이집트가 통합되며 고대 이집트 문명이 발전했습니다.</span></div><div class=\"history-item\"><b>기원전 26세기경</b><span>고왕국 시기에 대형 피라미드가 건설되었습니다.</span></div><div class=\"history-item\"><b>기원전 332년</b><span>알렉산드로스 대왕의 정복 이후 헬레니즘 문화가 들어왔습니다.</span></div><div class=\"history-item\"><b>기원전 30년</b><span>이집트가 로마 제국의 지배를 받게 되었습니다.</span></div><div class=\"history-item\"><b>1922년</b><span>영국으로부터의 독립을 향한 움직임이 크게 발전했습니다.</span></div><div class=\"history-item\"><b>1953년</b><span>이집트 공화국이 수립되었습니다.</span></div></div>","sources":"<p>자료 확인: 이집트 정부·통계자료, 국제통계, Wikimedia Commons 지도·이미지 자료 등을 참고했습니다.</p>"}};
const SECTIONS=[['basic','기본정보'],['map','실제 지도'],['flag','국기'],['capital','수도 설명'],['nature','자연과 기후'],['language','언어와 문자'],['food','음식'],['animals','동식물'],['places','전국의 명소'],['culture','대표 문화'],['history','역사'],['sources','자료']];
let current='KR';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function editAppTitle(){const old=localStorage.getItem('appTitle')||'세계 나라 백과사전';const n=prompt('백과사전 이름을 입력하세요.',old);if(n?.trim()){localStorage.setItem('appTitle',n.trim());document.querySelectorAll('#appTitle,.home .title').forEach(e=>{if(e.classList.contains('title'))e.childNodes[0].textContent=n.trim()+' ';else e.textContent=n.trim()})}}
function favorites(){try{return JSON.parse(localStorage.getItem('favorites')||'[]')}catch{return[]}}
function toggleFav(code){let a=favorites();a=a.includes(code)?a.filter(x=>x!==code):a.concat(code);localStorage.setItem('favorites',JSON.stringify(a));homeFilter('fav')}
function homeFilter(mode){const p=document.getElementById('homePanel');let codes=Object.keys(COUNTRY_META);if(mode==='fav')codes=codes.filter(c=>favorites().includes(c));let extra='';if(mode==='search')extra='<input id="countrySearch" class="searchbox" placeholder="나라 이름을 입력하세요" oninput="renderHomeList()">';if(mode==='continent'){const groups={};codes.forEach(c=>(groups[COUNTRY_META[c].continent]??=[]).push(c));extra=Object.entries(groups).map(([k,v])=>`<h2>${k}</h2>${countryCards(v)}`).join('');p.innerHTML=extra;return}p.innerHTML=(mode==='all'?'<h2>전체 나라</h2>':mode==='fav'?'<h2>즐겨찾기</h2>':'<h2>나라 이름검색</h2>')+extra+'<div id="homeList"></div>';renderHomeList(codes)}
let homeMode='all';
function renderHomeList(initial){let codes=initial||Object.keys(COUNTRY_META);const q=(document.getElementById('countrySearch')?.value||'').trim().toLowerCase();if(q)codes=codes.filter(c=>(COUNTRY_META[c].name+' '+COUNTRY_META[c].en).toLowerCase().includes(q));const el=document.getElementById('homeList');if(el)el.innerHTML=countryCards(codes)}
function countryCards(codes){return '<div class="country-grid">'+codes.map(c=>`<div class="country-card" onclick="openCountry('${c}')"><button class="star" onclick="event.stopPropagation();toggleFav('${c}')">${favorites().includes(c)?'★':'☆'}</button><h3>${esc(COUNTRY_META[c].name)}</h3><div>${esc(COUNTRY_META[c].en)} · ${esc(COUNTRY_META[c].continent)}</div><div class="source-note">수도: ${esc(COUNTRY_META[c].capital)}</div></div>`).join('')+'</div>'}
function goHome(){document.getElementById('countryView').classList.add('hidden');document.getElementById('homeView').classList.remove('hidden');homeFilter('all');window.scrollTo(0,0)}
function openCountry(code){current=code;document.getElementById('homeView').classList.add('hidden');document.getElementById('countryView').classList.remove('hidden');document.getElementById('countryName').textContent=COUNTRY_META[code].name;document.getElementById('nav').innerHTML=SECTIONS.map(x=>`<a href="#${x[0]}">${x[1]}</a>`).join('');renderCountry();window.scrollTo(0,0)}
function getBaseData(code){return code==='KR'?KOREA_BASE_DATA:OTHER_DATA[code]}
function compare(c){if(c==='KR')return '';const k=COUNTRY_META.KR;const a=countriesAreaRatio(COUNTRY_META[c].area,k.area),p=COUNTRY_META[c].pop/k.pop;return `<div class="compare">🇰🇷 대한민국과 비교하면: 면적은 약 ${a}배, 인구는 약 ${p.toFixed(1)}배입니다. (각국 통계의 기준연도는 다를 수 있습니다.)</div>`}
function countriesAreaRatio(a,b){return (a/b).toFixed(a/b>=10?0:1)}
function sectionText(code,id){if(code==='KR'){const raw=TEXT.KR[id];return raw||''}return TEXT[code]?.[id]||''}
function renderCountry(){const c=COUNTRY_META[current], d=getBaseData(current);let h='';h+=`<section id="basic"><h2>1. 기본정보</h2><div class="info-grid"><div class="info"><b>나라 이름</b>${esc(c.name)} (${esc(c.en)})</div><div class="info"><b>대륙</b>${esc(c.continent)}</div><div class="info"><b>수도</b>${esc(c.capital)}</div><div class="info"><b>면적</b>약 ${c.area.toLocaleString()}㎢ (${c.area_year}년 기준)</div><div class="info"><b>인구</b>약 ${c.pop}백만 명 (${c.pop_year}년 기준)</div><div class="info"><b>언어</b>${current==='KR'?'한국어':sectionText(current,'language').replace(/<[^>]+>/g,'').replace('언어와 문자','').slice(0,80)}</div></div>${current==='KR'?'<p>대한민국의 기본 설명은 V11의 내용을 그대로 보존합니다.</p>':`<p>${basicIntro(current)}</p>`}${compare(current)}</section>`;
 h+=`<section id="map"><h2>2. 실제 지도</h2><div class="map-grid">${mapCard(c,0)}${mapCard(c,1)}</div><p class="source-note">지도는 Wikimedia Commons 자료를 사용하고, 주변국과 바다 이름은 어린이가 위치를 쉽게 이해하도록 표시했습니다.</p></section>`;
 h+=`<section id="flag"><h2>3. 국기</h2><img class="flag" src="${c.flag}" alt="${esc(c.name)} 국기"><p>${flagDesc(current)}</p></section>`;
 h+=`<section id="capital"><h2>4. 수도 설명</h2>${sectionText(current,'capital')||'<p>수도에 대한 설명을 준비 중입니다.</p>'}</section>`;
 h+=`<section id="nature"><h2>5. 자연과 기후</h2>${sectionText(current,'nature')}</section>`;
 h+=`<section id="language"><h2>6. 언어와 문자</h2>${sectionText(current,'language')}<table class="greet"><tr><th>한국어 의미</th><th>원어</th><th>한글 발음</th></tr>${c.greeting.map(x=>`<tr><td>${x[0]==='Hello'||x[0]==='你好'||x[0]==='こんにちは'||x[0]==='Bonjour'||x[0]==='مرحبا'?'안녕하세요':'감사합니다'}</td><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('')}</table></section>`;
 h+=itemSection(7,'food','음식',d.food);h+=itemSection(8,'animals','동식물',d.animals);h+=itemSection(9,'places','전국의 명소',d.places);h+=itemSection(10,'culture','대표 문화',d.culture);
 h+=`<section id="history"><h2>11. 역사</h2>${sectionText(current,'history')}</section><section id="sources"><h2>12. 자료를 확인한 곳</h2>${sectionText(current,'sources')}<p class="source-note">※ 대한민국의 기존 기본자료·항목·설명은 V11을 기준 데이터로 고정했습니다. 이후 UI 업그레이드는 이 기준 데이터를 삭제하거나 축약하지 않고, 사용자 수정은 별도 저장소에 기록합니다.</p></section>`;
 document.getElementById('main').innerHTML=h;
}
function basicIntro(code){return {JP:'일본은 동아시아의 섬나라로 북쪽의 홋카이도에서 남쪽의 오키나와까지 여러 섬이 길게 이어져 있습니다.',CN:'중국은 동아시아에 있는 매우 넓은 나라로 다양한 지형과 기후, 오랜 역사를 가지고 있습니다.',US:'미국은 북아메리카에 자리한 넓은 나라로 대서양과 태평양에 접하고 다양한 자연환경이 나타납니다.',FR:'프랑스는 서유럽에 자리한 나라로 넓은 평야와 산지, 대서양과 지중해의 해안을 함께 가지고 있습니다.',EG:'이집트는 북아프리카에 있으며 나일강과 사막이 자연환경과 사람들의 생활에 큰 영향을 주는 나라입니다.'}[code]}
function flagDesc(code){return {KR:'태극기는 흰 바탕에 태극 문양과 네 개의 괘가 배치되어 있습니다.',JP:'일본 국기는 흰 바탕에 붉은 원이 있어 태양을 상징합니다.',CN:'중국 국기는 붉은 바탕에 큰 별 하나와 작은 별 네 개가 배치되어 있습니다.',US:'미국 국기는 별과 줄무늬를 사용하며 50개 주와 13개 식민지를 상징하는 요소를 담고 있습니다.',FR:'프랑스 국기는 파랑·흰색·빨강의 세로 줄무늬로 이루어져 있습니다.',EG:'이집트 국기는 빨강·흰색·검정의 가로 줄무늬와 중앙의 국장을 사용합니다.'}[code]}
function mapCard(c,i){const img=i?c.map2:c.map1;let labels=[...c.neighbors,...c.seas];return `<div class="map-card"><div class="map-image"><img src="${img}" alt="${esc(c.name)} 지도">${labels.slice(0,4).map((x,j)=>`<span class="map-label neighbor n${j+1}">${esc(x)}</span>`).join('')}${labels.slice(4,6).map((x,j)=>`<span class="map-label sea sea${j+1}">${esc(x)}</span>`).join('')}<span class="map-label country-label">${esc(c.name)}</span><button class="country-btn zoom" onclick="openModal('${img}')">확대해서 보기</button></div><h3>${i?'주변 지역을 함께 보는 지도':'나라의 위치 지도'}</h3></div>`}
function itemSection(num,sec,title,arr){return `<section id="${sec}"><h2>${num}. ${title}</h2><div class="item-grid">${arr.map((x,i)=>itemCard(sec,i,x)).join('')}</div><button class="home-btn" style="margin-top:12px" onclick="addItem('${sec}')">＋ 항목 추가</button></section>`}
function itemCard(sec,i,x){const id=x[0].replace(/\s/g,'_');return `<div class="card" id="${sec}-${i}"><div class="item-title"><h3>${esc(x[0])}</h3></div>${x[2]?`<img class="item-img" src="${x[2]}" alt="${esc(x[0])}">`:''}<p>${esc(x[1])}</p><div class="actions"><button class="photo-btn" onclick="addPhoto('${sec}','${esc(id)}')">사진 등록 / 바꾸기</button><div class="action-right"><button class="action-btn" onclick="editDesc('${sec}',${i})">설명 수정</button><button class="action-btn" onclick="restoreDesc('${sec}',${i})">원래 설명으로</button></div></div></div>`}
function addItem(sec){const n=prompt('추가할 항목의 이름을 입력하세요.');if(!n?.trim())return;const desc=prompt('기본 설명을 입력하세요.\n(외부 자료 검색 기능은 다음 단계에서 연결할 수 있습니다.)','');if(desc===null)return;let arr=getBaseData(current)[sec]||[];arr.push([n.trim(),desc.trim(),'']);if(current==='KR')KOREA_BASE_DATA[sec]=arr;else OTHER_DATA[current][sec]=arr;renderCountry()}
function editDesc(sec,i){const d=getBaseData(current)[sec][i][1];const n=prompt('설명을 수정하세요.',d);if(n===null)return;localStorage.setItem(`override_${current}_${sec}_${i}`,n);getBaseData(current)[sec][i][1]=n;renderCountry()}
function restoreDesc(sec,i){const key=`override_${current}_${sec}_${i}`;localStorage.removeItem(key);renderCountry()}
function addPhoto(sec,id){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{localStorage.setItem(`photo_${current}_${sec}_${id}`,r.result);renderCountry()};r.readAsDataURL(f)};input.click()}
function openModal(src){document.getElementById('modalImg').src=src;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function applyOverrides(){for(const code of Object.keys(COUNTRY_META))for(const sec of ['food','animals','places','culture']){const arr=getBaseData(code)[sec]||[];arr.forEach((x,i)=>{const v=localStorage.getItem(`override_${code}_${sec}_${i}`);if(v!==null)x[1]=v})}}
applyOverrides();homeFilter('all');
</script></body></html>
