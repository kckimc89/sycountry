const COUNTRIES={
kr:{name:'대한민국',flag:'🇰🇷',continent:'아시아',region:'동아시아',capital:'서울',area:'약 100,000 km²',population:'약 5,100만 명',language:'한국어',hello:'안녕하세요',thanks:'고마워요',script:'한글',intro:'아시아 동쪽에 있는 나라예요. 삼면이 바다와 닿아 있고 산과 도시가 함께 있어요.',nature:'산이 많은 지형이며 동쪽에는 높은 산들이 많아요. 동해·서해·남해와 여러 강과 섬이 있어요.',life:'도시와 농촌의 생활 모습이 서로 다르고, 학교·시장·대중교통 등 다양한 생활 모습을 볼 수 있어요.',food:[['김치','한국을 대표하는 발효 음식 가운데 하나예요. 배추와 무 등에 양념을 넣어 만들어요.','https://commons.wikimedia.org/wiki/Special:FilePath/Kimchi%20Korean%20dish.jpg'],['비빔밥','밥에 여러 나물과 재료를 넣고 양념과 함께 비벼 먹는 음식이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Bibimbap.jpg'],['불고기','얇게 썬 고기를 양념해 구워 먹는 음식이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Bulgogi.jpg']],fruit:[['사과','한국에서도 널리 재배되는 과일이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Red%20Apple.jpg'],['배','아삭하고 수분이 많은 과일이에요. 한국의 배는 특히 크고 단맛이 좋은 품종이 많아요.','https://commons.wikimedia.org/wiki/Special:FilePath/Asian%20pear.jpg'],['귤','제주도를 비롯한 따뜻한 지역에서 많이 재배되는 감귤류 과일이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Mandarin%20Oranges%20%28Citrus%20reticulata%29.jpg']],animal:[['호랑이','우리나라를 상징하는 동물로 자주 소개되는 큰 고양잇과 동물이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Panthera%20tigris%20altaica.jpg'],['두루미','습지와 논 주변에서 볼 수 있는 큰 새예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Grus%20japonensis%20-%20Hokkaido%20Japan%20-%20February%202012.jpg'],['반달가슴곰','가슴에 초승달 모양의 흰 무늬가 있는 곰이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Ursus%20thibetanus%20ussuricus.jpg']],places:[['경복궁','조선 시대에 지어진 대표적인 궁궐이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Gyeongbokgung-palace-01.jpg'],['제주도','화산 활동으로 만들어진 섬으로 한라산과 다양한 자연경관이 있어요.','https://commons.wikimedia.org/wiki/Special:FilePath/Jeju%20Island%20Hallasan.jpg'],['부산','바다와 항구, 산이 어우러진 큰 도시예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Busan%20from%20Hwangnyeongsan.jpg']],culture:[['설날','새해를 맞이하는 중요한 명절이에요. 가족이 함께 모여 인사를 나누고 떡국을 먹기도 해요.','https://commons.wikimedia.org/wiki/Special:FilePath/Seollal.jpg'],['추석','가을에 가족과 친척이 모여 조상에게 차례를 지내고 성묘하기도 하는 명절이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Chuseok%20in%20South%20Korea.jpg'],['김장','겨울을 앞두고 많은 양의 김치를 담그는 전통적인 문화예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Kimjang.jpg']]},
jp:{name:'일본',flag:'🇯🇵',continent:'아시아',region:'동아시아',capital:'도쿄',area:'약 378,000 km²',population:'약 1억 2천만 명',language:'일본어',hello:'こんにちは',thanks:'ありがとう',script:'히라가나 · 가타카나 · 한자',intro:'동아시아의 섬나라예요. 여러 섬으로 이루어져 있고 화산과 지진이 나타나는 지역이 많아요.',nature:'산지가 많고 화산과 온천이 유명해요. 바다와 섬이 나라 곳곳에 이어져 있어요.',life:'도시에서는 철도와 대중교통을 많이 이용하고, 지역마다 음식과 생활문화가 조금씩 달라요.',food:[['초밥','밥 위에 생선이나 여러 재료를 올리거나 말아 먹는 대표적인 일본 음식이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Sushi_platter.jpg'],['라멘','국물과 면을 기본으로 여러 재료를 넣어 먹는 면 요리예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Ramen%20by%20Kossy%20at%20Tokyo%20Station.jpg'],['오코노미야키','반죽에 여러 재료를 넣어 철판에서 부쳐 먹는 음식이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Okonomiyaki%20%28Japanese%20dish%29.jpg']],fruit:[['사과','아오모리현 등에서 사과가 많이 재배돼요.','https://commons.wikimedia.org/wiki/Special:FilePath/Apple%20tree%20in%20Japan.jpg'],['감귤','따뜻한 지역에서 다양한 감귤류가 재배돼요.','https://commons.wikimedia.org/wiki/Special:FilePath/Mikan%20orange.jpg'],['감','가을에 많이 먹는 과일로 일본에서도 여러 품종이 재배돼요.','https://commons.wikimedia.org/wiki/Special:FilePath/Kaki%20fruit.jpg']],animal:[['일본원숭이','추운 지역에서도 살아가는 원숭이로 온천에 들어가는 모습이 유명해요.','https://commons.wikimedia.org/wiki/Special:FilePath/Macaca%20fuscata%20-%20snow%20monkey.jpg'],['일본사슴','나라 공원 등에서 사람과 가까이 지내는 사슴으로 유명해요.','https://commons.wikimedia.org/wiki/Special:FilePath/Deer%20in%20Nara.jpg'],['일본산양','일본의 산악지역에 사는 야생 염소류 동물이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Serow%20Japan.jpg']],places:[['후지산','일본을 대표하는 높은 화산으로 아름다운 모습으로 잘 알려져 있어요.','https://commons.wikimedia.org/wiki/Special:FilePath/Mount%20Fuji%20from%20Lake%20Kawaguchi.jpg'],['도쿄','일본의 수도이며 매우 큰 도시예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Tokyo%20Skytree%20and%20Mount%20Fuji.jpg'],['교토','오래된 사찰과 전통문화가 많이 남아 있는 도시예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Kiyomizu-dera%20in%20Kyoto.jpg']],culture:[['벚꽃놀이','봄에 벚꽃을 감상하며 가족이나 친구와 시간을 보내는 문화예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Cherry%20blossoms%20in%20Japan.jpg'],['다도','차를 준비하고 손님에게 대접하는 일본의 전통문화예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Japanese%20tea%20ceremony.jpg'],['마쓰리','지역마다 열리는 전통 축제로 행렬과 음악, 음식 등을 즐겨요.','https://commons.wikimedia.org/wiki/Special:FilePath/Japanese%20festival.jpg']]},
cn:{name:'중국',flag:'🇨🇳',continent:'아시아',region:'동아시아',capital:'베이징',area:'약 9,600,000 km²',population:'약 14억 명',language:'중국어',hello:'你好',thanks:'谢谢',script:'한자',intro:'아시아 동쪽에 있는 매우 넓은 나라예요. 높은 산, 넓은 초원, 사막, 큰 강과 바다가 있어요.',nature:'서쪽에는 높은 산과 티베트고원이 있고 북쪽에는 초원과 사막이 있어요. 양쯔강과 황허 같은 큰 강도 흐릅니다.',life:'대도시와 농촌, 산악지역, 해안지역의 생활 모습이 서로 달라요. 지역에 따라 음식과 집의 모습도 다양해요.',food:[['딤섬','작은 크기의 다양한 음식을 찜통 등에 담아 즐기는 광둥 지역 음식문화로 유명해요.','https://commons.wikimedia.org/wiki/Special:FilePath/Dimsum%20Hong%20Kong.jpg'],['마파두부','두부와 다진 고기, 매콤한 양념을 함께 끓여 만드는 쓰촨 요리예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Mapo%20tofu.jpg'],['베이징 오리구이','오리를 바삭하게 구워 얇은 전병과 소스 등을 곁들여 먹는 음식이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Peking%20duck%20dish.jpg']],fruit:[['귤','중국의 여러 따뜻한 지역에서 다양한 감귤류가 재배돼요.','https://commons.wikimedia.org/wiki/Special:FilePath/Mandarin%20Oranges.jpg'],['복숭아','여러 지역에서 재배되는 대표적인 여름 과일 가운데 하나예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Peaches.jpg'],['리치','따뜻한 지역에서 많이 재배되는 달콤한 열대·아열대 과일이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Lychee%20fruit.jpg']],animal:[['판다','중국을 대표하는 동물로 대나무를 주로 먹어요.','https://commons.wikimedia.org/wiki/Special:FilePath/Grosser_Panda.JPG'],['황금들창코원숭이','중국의 산악지역 숲에 사는 원숭이예요.','https://commons.wikimedia.org/wiki/Special:FilePath/Rhinopithecus%20roxellana.jpg'],['양쯔강돌고래','양쯔강에 살던 민물돌고래로 현재는 매우 희귀해요.','https://commons.wikimedia.org/wiki/Special:FilePath/Baiji.jpg']],places:[['만리장성','중국 북부에 길게 이어진 거대한 성벽 유적이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/GreatWall_2004_Summer_4.jpg'],['자금성','베이징에 있는 옛 황궁으로 지금은 고궁박물원으로 이용돼요.','https://commons.wikimedia.org/wiki/Special:FilePath/Forbidden%20City%20Beijing%20China.jpg'],['장자제','기둥처럼 솟은 바위산이 이어지는 독특한 자연경관으로 유명해요.','https://commons.wikimedia.org/wiki/Special:FilePath/Zhangjiajie%20National%20Forest%20Park.jpg']],culture:[['춘절','중국의 중요한 전통 명절로 음력 새해를 맞이하며 가족이 모여요.','https://commons.wikimedia.org/wiki/Special:FilePath/Chinese%20New%20Year%20celebration.jpg'],['중추절','가을에 가족이 모여 달을 감상하고 월병을 먹는 명절이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Mid-Autumn%20Festival%20lantern.jpg'],['용선제','용선 경주와 쫑즈 등이 알려진 전통 명절이에요.','https://commons.wikimedia.org/wiki/Special:FilePath/Dragon%20Boat%20Festival%20Hong%20Kong.jpg']]}
};
const CAT={food:'🍜 음식',fruit:'🍎 과일',animal:'🐘 자연·동물',places:'🏛️ 유명한 장소',culture:'🎉 유명한 축제 / 문화'};
function key(...a){return PREFIX+a.join('_')}
function read(k,d){try{return JSON.parse(localStorage.getItem(key(k)))??d}catch{return d}}
function write(k,v){localStorage.setItem(key(k),JSON.stringify(v))}
let fav=read('fav',{}), custom=read('custom',{}), hidden=read('hidden',{}), photos=read('photos',{});
function photoFor(c,cat,i,src){return photos[c+'_'+cat+'_'+i]||src}
function setPhoto(k,src){photos[k]=src;write('photos',photos)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function img(url,alt,pk){return `<img data-pk="${esc(pk)}" src="${url}" alt="${esc(alt)}" loading="lazy" onerror="resolveImage(this)">`}
function renderHome(){let q=document.getElementById('search').value.trim(), c=document.getElementById('continent').value;let arr=Object.entries(COUNTRIES).filter(([id,x])=>(!q||x.name.includes(q))&&(c==='all'||(c==='fav'?fav[id]:x.continent===c)));document.getElementById('countryGrid').innerHTML=arr.map(([id,x])=>`<div class="country-card" role="button" tabindex="0" onclick="showCountry('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showCountry('${id}')}"><button class="fav" onclick="event.stopPropagation();toggleFav('${id}')">${fav[id]?'⭐':'☆'}</button>${img(x.food[0][2],x.name,id+'_cover')}<span class="flag">${x.flag}</span><div class="name">${x.name}</div><div class="meta">${x.continent} · ${x.region}</div></div>`).join('')||'<div class="empty">찾는 나라가 없어요.</div>'}
function toggleFav(id){fav[id]=!fav[id];write('fav',fav);renderHome()}
function resetFilter(){document.getElementById('search').value='';document.getElementById('continent').value='all';renderHome()}
function renameBook(){let v=prompt('백과사전 이름을 입력하세요',read('title','세계 나라 백과사전'));if(v&&v.trim()){write('title',v.trim());document.getElementById('bookTitle').textContent=v.trim()}}
function showCountry(id){document.querySelectorAll('.screen').forEach(x=>x.style.display='none');let el=document.getElementById('country-'+id);if(!el){el=buildCountry(id);document.getElementById('countries').appendChild(el)}el.style.display='block';scrollTo(0,0)}
function showHome(){document.querySelectorAll('.screen').forEach(x=>x.style.display='none');document.getElementById('home').style.display='block';renderHome();scrollTo(0,0)}
function buildCountry(id){let x=COUNTRIES[id], sec=document.createElement('section');sec.className='screen';sec.id='country-'+id;sec.innerHTML=`<button class="back" onclick="showHome()">← 나라 목록으로 돌아가기</button><div class="country-head"><div class="country-flag">${x.flag}</div><h2>${x.name}</h2><div class="tag">${x.continent} · ${x.region}</div><p style="margin-top:10px">${x.intro}</p></div><div class="section"><h3>🌍 한눈에 알아보기</h3><div class="facts"><div class="fact"><b>대륙 · 지역</b><span>${x.continent} · ${x.region}</span></div><div class="fact"><b>수도</b><span>${x.capital}</span></div><div class="fact"><b>면적</b><span>${x.area}</span></div><div class="fact"><b>한국과 면적 비교</b><span>${compareArea(x.area)}</span></div><div class="fact"><b>인구</b><span>${x.population}</span></div><div class="fact"><b>주요 언어</b><span>${x.language}</span></div></div></div><div class="section"><h3>🗣️ 언어</h3><div class="lang"><b>안녕하세요</b> <span class="foreign">${x.hello}</span><br><b>한국어 발음</b> ${pronounce(id,'hello')}<br><br><b>고마워요</b> <span class="foreign">${x.thanks}</span><br><b>한국어 발음</b> ${pronounce(id,'thanks')}<br><br><b>문자 · 언어</b> ${x.script}</div></div><div class="section"><h3>🏔️ 자연환경</h3><p>${x.nature}</p></div><div class="section"><h3>🏠 사람들의 생활</h3><p>${x.life}</p></div>${categorySection(id,x,'food')} ${categorySection(id,x,'fruit')} ${categorySection(id,x,'animal')} ${categorySection(id,x,'places')} ${categorySection(id,x,'culture')}<div class="section"><h3>💡 이 나라를 더 알아보기</h3><p>아이와 함께 사진을 보면서 궁금한 점을 하나씩 찾아보세요. 서로 다른 생활 모습도 비교해 보면 더 재미있어요.</p></div>`;return sec}
function compareArea(a){if(a.includes('100,000'))return '한국과 비슷해요';if(a.includes('378,000'))return '한국보다 약 3.8배 넓어요';return '한국보다 매우 넓어요'}
function pronounce(id,t){return id==='kr'?(t==='hello'?'안녕하세요':'고마워요'):id==='jp'?(t==='hello'?'곤니치와':'아리가토'):('니하오'===COUNTRIES[id].hello?'니하오':'셰셰')}
function categorySection(id,x,cat){let base=x[cat], h=CAT[cat];let hiddenSet=new Set((hidden[id]?.[cat]||[]));let items=base.map((v,i)=>({name:v[0],desc:v[1],src:photoFor(id,cat,i,v[2]),default:true,idx:i})).filter(v=>!hiddenSet.has(v.name));let customs=(custom[id]?.[cat]||[]).map((v,i)=>({...v,custom:true,idx:'c'+i}));items=[...items,...customs];let grid=items.map(v=>itemCard(id,cat,v)).join('')||'<div class="empty">아직 등록된 자료가 없어요.</div>';let add=cat==='culture'?`<div class="culture-add"><h4>➕ 내가 궁금한 축제·문화 추가하기</h4><input id="add-${id}" placeholder="예: 어떤 축제나 문화를 알고 싶나요?"><button class="addbtn" onclick="addCustomCulture('${id}')">🔎 확인하고 추가하기</button><div class="notice">한국어 위키백과에서 이름을 확인합니다. 인터넷 검색이 되지 않아도 직접 등록할 수 있어요.</div></div>`:'';return `<div class="section" id="${id}-${cat}"><h3>${h}</h3><div class="cards">${grid}</div>${add}</div>`}
function itemCard(id,cat,v){let pk=id+'_'+cat+'_'+v.idx;return `<div class="item-card" onclick="openItem('${id}','${cat}','${String(v.idx)}',${v.default?'true':'false'})">${img(v.src,v.name,pk)}<div class="item-name">${esc(v.name)}</div><small>눌러서 자세히 보기</small></div>`}
function openItem(id,cat,idx,isDefault){let x=COUNTRIES[id], v=isDefault?x[cat][Number(idx)]:custom[id][cat][Number(idx.slice(1))];let src=isDefault?photoFor(id,cat,Number(idx),v[2]):v.src;document.querySelectorAll('.screen').forEach(s=>s.style.display='none');let sec=document.createElement('section');sec.className='screen';sec.style.display='block';sec.innerHTML=`<button class="back" onclick="showCountry('${id}')">← ${x.name} ${CAT[cat]}로 돌아가기</button><div class="section detail"><div>${img(src,v.name,id+'_'+cat+'_'+idx)}</div><h2>${esc(v.name)}</h2><div class="box">${esc(v[1]||v.desc)}</div><div class="box" style="margin-top:10px"><b>💡 알아두면 좋은 점</b><br>${esc(v[1]||v.desc)} 아이와 함께 사진을 보며 궁금한 점을 이야기해 보세요.</div>${isDefault?`<div class="manage"><button onclick="event.stopPropagation();deleteDefault('${id}','${cat}',${Number(idx)})">🗑️ 삭제</button></div>`:`<div class="manage"><button onclick="deleteCustom('${id}','${cat}',${Number(idx.slice(1))})">🗑️ 삭제</button></div>`}</div>`;document.getElementById('countries').appendChild(sec)}
function deleteDefault(id,cat,idx){let v=COUNTRIES[id][cat][idx];if(!confirm(`'${v[0]}'을(를) 기본 목록에서 삭제할까요?`))return;hidden[id]??={};hidden[id][cat]??=[];if(!hidden[id][cat].includes(v[0]))hidden[id][cat].push(v[0]);write('hidden',hidden);showCountry(id)}
function deleteCustom(id,cat,idx){if(!confirm('이 자료를 삭제할까요?'))return;custom[id][cat].splice(idx,1);write('custom',custom);showCountry(id)}
async function addCustomCulture(id){let input=document.getElementById('add-'+id),name=input.value.trim();if(!name)return alert('이름을 입력해 주세요.');let base=COUNTRIES[id].culture.map(v=>v[0]);let customs=custom[id]?.culture||[];if(base.includes(name)&&!(hidden[id]?.culture||[]).includes(name))return alert('이미 등록된 축제·문화예요.');if(customs.some(v=>v.name===name))return alert('이미 등록된 자료예요.');let btn=input.nextElementSibling;btn.disabled=true;btn.textContent='🔎 확인 중…';try{let r=await wiki(name);let chosen=r&&r.title?r.title:name;let src=r?.thumbnail?.source||'';custom[id]??={};custom[id].culture??=[];custom[id].culture.push({name:chosen,desc:r?.extract||`${name}에 대해 아이와 함께 알아볼 수 있는 자료예요.`,src});write('custom',custom);showCountry(id);alert(`'${chosen}'을(를) 추가했어요.`)}catch(e){custom[id]??={};custom[id].culture??=[];custom[id].culture.push({name,desc:`${name}에 대해 아이와 함께 알아볼 수 있는 자료예요.`,src:''});write('custom',custom);showCountry(id);alert(`인터넷 확인이 어려워 '${name}'을(를) 직접 등록했어요.`)}finally{btn.disabled=false;btn.textContent='🔎 확인하고 추가하기'}}
async function wiki(name){let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),5000);try{let u='https://ko.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts|pageimages&exintro=1&explaintext=1&pithumbsize=900&titles='+encodeURIComponent(name);let j=await fetch(u,{signal:ctl.signal});if(!j.ok)throw Error('http');let d=await j.json(),p=Object.values(d.query.pages)[0];if(!p||p.missing)return null;return {title:p.title,extract:p.extract,thumbnail:p.thumbnail}}finally{clearTimeout(timer)}}
async function resolveImage(el){if(el.dataset.resolved)return;el.dataset.resolved='1';let name=el.alt;try{let r=await wiki(name);if(r?.thumbnail?.source){el.src=r.thumbnail.source;let pk=el.dataset.pk;if(pk){setPhoto(pk,r.thumbnail.source);document.querySelectorAll(`[data-pk="${CSS.escape(pk)}"]`).forEach(i=>{i.src=r.thumbnail.source})}}}catch{el.style.objectFit='contain';el.removeAttribute('onerror')}}
function backup(){let data={format:'world-country-v2',version:1,title:read('title','세계 나라 백과사전'),fav,custom,hidden,photos};let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),file=new File([blob],'세계나라백과사전_백업.json',{type:'application/json'});if(navigator.share&&navigator.canShare?.({files:[file]})){navigator.share({title:'세계 나라 백과',files:[file]}).catch(()=>{})}else{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.textContent='⬇️ 백업 파일 저장하기';a.style.display='block';a.style.marginTop='10px';a.style.padding='12px';a.style.textAlign='center';a.style.background='#fff4bd';a.style.borderRadius='12px';document.querySelector('#home .section:last-child').appendChild(a);setTimeout(()=>URL.revokeObjectURL(a.href),60000)}}
document.getElementById('restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.format!=='world-country-v2')throw Error('format');if(!confirm('현재 자료를 백업 파일 내용으로 바꿀까요?'))return;fav=d.fav||{};custom=d.custom||{};hidden=d.hidden||{};photos=d.photos||{};write('fav',fav);write('custom',custom);write('hidden',hidden);write('photos',photos);if(d.title)write('title',d.title);location.reload()}catch{alert('이 백업 파일을 읽을 수 없어요.')}});
document.getElementById('search').addEventListener('input',renderHome);document.getElementById('continent').addEventListener('change',renderHome);document.getElementById('bookTitle').textContent=read('title','세계 나라 백과사전');renderHome();
</script></body></html>
